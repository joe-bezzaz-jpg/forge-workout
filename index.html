<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="theme-color" content="#0A0A0C">
<title>FORGE — Strength</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  /* BePresent-style light system */
  /* Apple dark system: black canvas, charcoal surfaces, one blue action */
  --brand:#0071e3; --brand2:#2997ff; --brand-deep:#0071e3;
  --bg:#000000; --bg2:#1d1d1f;
  --card:#1d1d1f; --card2:#000000; --card3:#333336;
  --line:rgba(134,134,139,.22); --line2:rgba(134,134,139,.38);
  --text:#f5f5f7; --muted:#86868b; --dim:#6e6e73;
  --accent:#0071e3; --accent-ink:#ffffff; --accent-dim:rgba(41,151,255,.14);
  --link:#2997ff;
  --gold:#f5f5f7; --gold-dim:rgba(255,255,255,.08); --gold-bg:#333336;
  --orange:#f5f5f7; --orange-bg:#333336;
  --success:#2997ff; --success-dim:rgba(41,151,255,.12); --success-line:rgba(41,151,255,.45);
  --danger:#ff453a; --danger-dim:rgba(255,69,58,.14); --danger-deep:#ff453a;
  --warn:#ff9f0a;
  --pink:#f2416b; --blue:#0090f7; --purple:#ba62fc; --ember:#f55600;
  --spectrum:linear-gradient(108deg,#0090f7,#ba62fc 33%,#f2416b 66%,#f55600);
  --shadow:none; --shadow2:none;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --r:28px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.tab,.quest,.dcard,.chip,.pill,.list-item,.trophy,input,select{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.47; letter-spacing:-.022em; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  position:fixed; inset:0; overflow:hidden; width:100%;
}
#app{max-width:520px;margin:0 auto;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;position:relative;z-index:1}
html,body{overflow-x:hidden}
.screen{display:none;padding:calc(10px + var(--sat)) 16px calc(92px + max(6px,calc(var(--sab) - 20px)));animation:fadeUp .28s ease both;position:relative;min-height:100%;overflow:hidden}
.screen.active{display:block}
/* brand band curving in from the top (every screen) */
/* faint volt glow at the top instead of a colour band */
.screen::before,.overlay .wk-wrap::before{content:none}
.screen>*{position:relative;z-index:1}
.screen>.spread:first-child h1,.screen>.spread:first-child .eyebrow{color:#fff}
.screen>.spread:first-child .eyebrow{color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes pulseGlow{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
h1,h2,h3,.big-num,.countdown,.wletter{font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:600}
h1{font-size:32px;letter-spacing:.004em;line-height:1.13}
b,strong{font-weight:600}
.icn{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;display:inline-block;flex-shrink:0}
.reveal{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes shine{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(230%) skewX(-18deg)}}
@keyframes crateShake{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-7deg)}94%{transform:rotate(7deg)}97%{transform:rotate(-4deg)}}
@keyframes ringPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.eyebrow{font-size:14px;font-weight:400;letter-spacing:-.006em;color:var(--muted)}
.eyebrow.acc{color:var(--link)}
.big-num{font-size:56px;font-weight:600;letter-spacing:-.005em;line-height:1.07;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}

.card{background:var(--card);border:none;border-radius:var(--r);padding:24px;margin-bottom:12px;position:relative;overflow:hidden}
.card.flat{background:transparent;border:1px solid var(--line)}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.spread{display:flex;justify-content:space-between;align-items:center}

/* chunky raised buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:9999px;
  padding:15px 22px;font-size:17px;font-weight:600;letter-spacing:-.022em;cursor:pointer;font-family:inherit;
  transition:transform .12s ease,filter .12s ease,opacity .12s ease;position:relative}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--card3);color:var(--text)}
.btn.danger{background:var(--danger-dim);color:var(--danger)}
.btn:active{transform:scale(.98);filter:brightness(1.12)}
.btn.small{padding:10px 18px;font-size:15px;width:auto}
.btn:disabled{opacity:.4;pointer-events:none}

/* ---------- tab bar (floating white pill) ---------- */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;width:100%;
  background:rgba(29,29,31,.72);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  border-radius:26px 26px 0 0;display:flex;align-items:center;justify-content:space-around;
  padding:5px 8px max(6px,calc(var(--sab) - 20px));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 -8px 30px rgba(0,0,0,.5);
  border-top:1px solid rgba(255,255,255,.07)}
#tab-ind{position:absolute;top:5px;bottom:max(6px,calc(var(--sab) - 20px));left:0;width:0;border-radius:9999px;pointer-events:none;
  background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 10px rgba(0,0,0,.25);
  backdrop-filter:blur(2px) brightness(1.25) saturate(1.3);-webkit-backdrop-filter:blur(2px) brightness(1.25) saturate(1.3);
  transition:left .5s cubic-bezier(.3,1.4,.4,1),width .5s cubic-bezier(.3,1.4,.4,1),transform .5s cubic-bezier(.3,1.4,.4,1);
  transform-origin:center;opacity:0}
#tab-ind.on{opacity:1}
#tab-ind.travel{transform:scaleX(1.35) scaleY(.9)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;position:relative;z-index:1;
  color:rgba(235,235,240,.72);font-family:inherit;font-size:11px;font-weight:500;letter-spacing:-.01em;cursor:pointer;padding:8px 0 5px;border-radius:9999px;transition:color .25s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:#fff}
.tab.train{flex:0 0 auto;padding:0 6px}
.tab.train .train-btn{width:50px;height:50px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,113,227,.45)}
.tab.train .train-btn svg{stroke:#fff;width:24px;height:24px;stroke-width:2}
.tab.train:active .train-btn{filter:brightness(1.12);transform:scale(.95)}

/* ---------- header pills / xp ---------- */
.pills{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;background:var(--card);
  padding:6px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;color:var(--text);letter-spacing:-.01em}
.pill.xp,.pill.streak{background:var(--card)}
.xpchip{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);color:var(--text);border-radius:9999px;
  padding:4px 10px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle;letter-spacing:-.01em}
.xpfloat{position:fixed;z-index:400;pointer-events:none;background:rgba(66,66,69,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-radius:9999px;padding:8px 14px;
  font-weight:600;font-size:15px;animation:xpfly 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes xpfly{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-90px) scale(.9);opacity:0}}
/* ---------- quests ---------- */
.quest{display:flex;align-items:center;gap:14px;background:var(--card2);border:1px solid transparent;border-radius:18px;padding:14px 16px;margin-top:10px;cursor:pointer;transition:all .3s}
.quest .chk{width:28px;height:28px;border-radius:50%;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:13px;color:#5c5c61;flex-shrink:0;transition:all .3s;font-weight:600}
.quest.done{background:rgba(41,151,255,.08);border-color:rgba(41,151,255,.25)}
.quest.done .chk{background:var(--brand);color:#fff;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.quest.done .qt{text-decoration:line-through;color:var(--muted)}
.quest .qt{flex:1;font-weight:500;font-size:16px;letter-spacing:-.022em}
.quest .qs{font-size:13px;color:var(--muted);font-weight:400;margin-top:1px}
.qbar{height:8px;border-radius:4px;background:var(--card3);overflow:hidden;margin:12px 0 4px}
.qbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
/* ---------- profile header ---------- */
.phead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.avwrap{position:relative;width:54px;height:54px;flex-shrink:0;cursor:pointer}
.avwrap svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.avatar{position:absolute;inset:5px;border-radius:50%;background:var(--card3);display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;color:var(--text);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avbadge{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:#000;border:1.5px solid var(--bg);
  display:flex;align-items:center;justify-content:center;color:var(--link)}
.phead .who{flex:1;min-width:0}
.phead .g{font-size:13px;color:var(--muted);letter-spacing:-.006em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .n{font-size:20px;font-weight:600;letter-spacing:.011em;line-height:1.19;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- day strip (chain) ---------- */
.daystrip{display:flex;gap:6px;margin:0 0 16px}
.dcard{flex:1;min-width:0;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:11px 0 9px;transition:transform .2s ease,background .2s;cursor:pointer;position:relative;color:var(--muted)}
.dcard .dw{font-size:12px;line-height:1;letter-spacing:-.01em}
.dcard .dn{font-size:17px;font-weight:600;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums}
.dcard .dc{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--card3);color:transparent;margin-top:2px}
.dcard.trained .dc{background:var(--brand);color:#fff}
.dcard.rest .dc{background:#48484a;color:#fff}
.dcard.missed .dc{background:rgba(255,69,58,.16);color:var(--danger)}
.dcard.today{background:#f5f5f7;color:#6e6e73}
.dcard.today .dn{color:#000}
.dcard.today .dc{background:#dcdce1;color:#a1a1a6}
.dcard.today.trained .dc{background:var(--brand);color:#fff}
.dcard.today.rest .dc{background:#48484a;color:#fff}
.dcard.future{opacity:.45}
.dcard:active{transform:scale(.95)}
/* ---------- embers/plates canvas ---------- */
.streak-hero canvas.embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.streak-hero>*:not(canvas){position:relative;z-index:1}
/* ---------- league ---------- */
.trophies{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 8px 2px}
.trophies span{font-size:30px;filter:grayscale(1);opacity:.3;transition:all .3s}
.trophies span.on{filter:none;opacity:1;transform:scale(1.3)}
.trophies span.won{filter:none;opacity:.75}

/* ---------- today ---------- */
.streak-hero{background:var(--card);border:none;border-radius:var(--r);
  padding:26px 24px 22px;margin-bottom:12px;position:relative;overflow:hidden}
.streak-hero.danger{background:#2a1a19}
.flame{display:inline-block;animation:pulseGlow 2.4s ease-in-out infinite}
.countdown{font-size:48px;font-weight:600;letter-spacing:-.005em;font-variant-numeric:tabular-nums;text-align:center;line-height:1.05;margin:12px 0 12px}
.countdown-bar{height:12px;border-radius:6px;background:var(--card3);overflow:hidden;position:relative}
.countdown-bar i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width 1s linear}
.countdown-bar.warn i{background:var(--warn)} .countdown-bar.danger i{background:var(--danger)}
.cd-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:9999px;padding:6px 10px 6px 6px}
.cd-row .countdown-bar{flex:1}

.nextup{border:none;border-radius:var(--r);padding:24px;margin-bottom:12px;background:var(--card)}
.nextup .wletter{font-size:64px;font-weight:600;letter-spacing:-.009em;line-height:.9;color:var(--link)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:none;border-radius:20px;padding:16px}
.stat .v{font-size:28px;font-weight:600;letter-spacing:.007em;margin-top:2px;font-family:"SF Pro Display",-apple-system,sans-serif}
.stat .l{font-size:14px;color:var(--muted);font-weight:400;letter-spacing:-.006em}
.xpbar{height:8px;border-radius:4px;background:var(--card3);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.screen>.spread:first-child .xpbar{background:var(--card3)} .screen>.spread:first-child .xpbar i{background:var(--brand)}

/* ---------- heatmap ---------- */
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.hm-cell{width:100%;aspect-ratio:1;border-radius:4px;background:#2c2c2e;min-height:8px}
.hm-cell.l1{background:rgba(41,151,255,.3)} .hm-cell.l2{background:rgba(41,151,255,.55)}
.hm-cell.l3{background:rgba(41,151,255,.8)} .hm-cell.l4{background:var(--link)}
.hm-cell.rec{background:rgba(245,245,247,.45)}
.hm-cell.miss{background:rgba(255,69,58,.45)}
.hm-cell.today{outline:2px solid var(--text)}

/* ---------- segmented ---------- */
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:2px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:56px;border:none;background:none;color:var(--muted);font-family:inherit;font-size:14px;font-weight:500;letter-spacing:-.01em;
  padding:9px 12px;border-radius:12px;cursor:pointer}
.seg button.active{background:var(--card3);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:none;background:var(--card);color:var(--muted);border-radius:9999px;
  padding:9px 16px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;letter-spacing:-.01em}
.chip.active{background:var(--text);color:#000}

/* ---------- workout mode ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none;max-width:520px;margin:0 auto}
.overlay.open{display:block;animation:fadeUp .25s ease both}
.wk-wrap{padding:calc(14px + var(--sat)) 18px calc(30px + var(--sab));min-height:100vh;display:flex;flex-direction:column;position:relative}
.wk-wrap>*{position:relative;z-index:1}
.wk-wrap .onband .eyebrow.acc{color:var(--link)}
.wk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:none;color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-family:inherit}
.setdots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.setdots i{width:28px;height:6px;border-radius:3px;background:var(--card3)}
.setdots i.done{background:var(--link)} .setdots i.cur{background:var(--text)}
.input-stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:none;
  border-radius:22px;padding:8px}
.input-stepper .stp{width:50px;height:50px;border-radius:50%;background:var(--card3);border:none;color:var(--text);
  font-size:26px;font-weight:400;cursor:pointer;font-family:inherit}
.input-stepper .stp:active{filter:brightness(1.2)}
.input-stepper .val{flex:1;text-align:center;background:none;border:none;color:var(--text);font-family:"SF Pro Display",-apple-system,sans-serif;
  font-size:40px;font-weight:600;letter-spacing:0;width:90px;font-variant-numeric:tabular-nums;outline:none}
.tile{background:var(--card2);border-radius:22px;padding:14px 14px 12px}
.tile .tl{font-size:14px;color:var(--muted);letter-spacing:-.006em;font-weight:400;margin-bottom:4px}
.tile .tv{font-family:"SF Pro Display",-apple-system,sans-serif;font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-align:center;background:none;border:none;color:var(--text);width:100%;outline:none}
.tile .tb{display:flex;gap:8px;margin-top:10px}
.tile .tb button{flex:1;height:44px;border-radius:9999px;border:none;background:var(--card3);color:var(--text);font-size:24px;font-family:inherit;cursor:pointer}
.tile .tb button:active{filter:brightness(1.2)}
.score{background:var(--card);border-radius:var(--r);padding:20px 22px;margin:14px 0 12px}
.score .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.score .side .k{font-size:14px;color:var(--muted);letter-spacing:-.006em;font-weight:400}
.score .side .n{font-family:"SF Pro Display",-apple-system,sans-serif;font-size:40px;font-weight:600;line-height:1.05;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.score .side .u{font-size:13px;color:var(--muted);margin-top:2px}
.score .side.right{text-align:right}
.score .vsmark{font-size:13px;color:var(--dim);padding-bottom:16px}
.score .bar{height:8px;border-radius:4px;background:var(--card3);overflow:hidden;margin:16px 0 8px;position:relative}
.score .bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.score .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);left:100%;transform:translateX(-2px)}
.score .bar.win i{background:var(--link)}
.score .msg{font-size:15px;color:var(--text);letter-spacing:-.01em}
.score .msg.win{color:var(--link)}
.score .sub{font-size:13px;color:var(--muted);margin-top:4px}
.prev-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:none;
  border-radius:9999px;padding:7px 14px;font-size:14px;color:var(--muted);font-weight:400}
.target-banner{background:var(--card);border:none;border-radius:22px;padding:18px 20px;margin:14px 0}

/* editable set chips */
.chipset{border:none;border-radius:9999px;background:var(--card3);color:var(--text);font-family:inherit;
  font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;padding:7px 13px;cursor:pointer}
.chipset:active{filter:brightness(1.4)}
.chipset.undo{background:transparent;color:var(--muted);padding:7px 8px}
/* superset stacked pair */
.sscard{background:var(--card);border-radius:22px;padding:16px;margin-bottom:10px;border:1px solid rgba(41,151,255,.18)}
.ssnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--link);
  color:#000;font-size:12px;font-weight:600;margin-right:8px;vertical-align:2px}
.sscard .tile{background:#000;padding:10px 12px}
.sscard .tv{font-size:32px}
.sscard .tb button{height:38px;font-size:20px}
/* inline rest timer */
.restbar{background:var(--card);border-radius:22px;padding:14px 16px 12px;margin-bottom:10px;animation:fadeUp .25s ease both}
.restbar .rdot{width:10px;height:10px;border-radius:50%;background:var(--link);animation:pulseGlow 1.2s ease-in-out infinite;flex-shrink:0}
.restbar .rtrack{height:6px;border-radius:3px;background:var(--card3);overflow:hidden;margin-top:12px}
.restbar .rtrack i{display:block;height:100%;background:var(--link);border-radius:3px;transition:width .25s linear}
.rbtn{border:none;border-radius:9999px;background:var(--card3);color:var(--text);font-family:inherit;font-size:14px;font-weight:500;padding:8px 14px;cursor:pointer}
.rbtn:active{filter:brightness(1.3)}
.rbtn.skip{background:var(--brand);color:#fff}

/* PR toast */
#toast-zone{position:fixed;top:calc(12px + var(--sat));left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(66,66,69,.78);backdrop-filter:blur(20px) saturate(1);-webkit-backdrop-filter:blur(20px);border:none;color:#fff;border-radius:9999px;padding:12px 20px;
  font-weight:500;font-size:15px;display:flex;align-items:center;gap:10px;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both;
  position:relative;overflow:hidden;letter-spacing:-.01em}
.toast::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 1.1s ease .25s 2}
.toast.acc{background:rgba(0,113,227,.85)}

/* ---------- awards ---------- */
.trophy{display:flex;gap:14px;align-items:center;background:var(--card);border:none;border-radius:20px;padding:14px 16px;margin-bottom:10px}
.trophy .ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  background:var(--card3);border:none}
.trophy.locked{opacity:.6}
.trophy.locked .ic{background:var(--card2);filter:grayscale(1)}
.lvlbar{height:9px;border-radius:5px;background:var(--card3);overflow:hidden;margin-top:6px}
.lvlbar i{display:block;height:100%;background:var(--link);border-radius:5px}

/* ---------- lists / sheets ---------- */
.list-item{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
#sheet-veil{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none}
#sheet-veil.open{display:block;animation:fadeUp .2s both}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:210;max-width:520px;margin:0 auto;background:var(--bg2);
  border:none;border-radius:28px 28px 0 0;max-height:88vh;overflow-y:auto;display:none;
  padding:10px 20px calc(30px + var(--sab))}
#sheet.open{display:block;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:5;background:var(--bg2);margin:-10px -20px 10px;padding:12px 20px 10px;
  display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grabber{width:44px;height:5px;border-radius:3px;background:#48484a}
.sheet-x{position:absolute;right:16px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--card3);border:none;
  color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.sheet-x:active{filter:brightness(1.4)}
#sheet .card,#sheet .stat,#sheet .chart-box,#sheet .quest,#sheet .tile{background:#000}

/* ---------- charts ---------- */
.chart-box{background:var(--card);border:none;border-radius:var(--r);padding:20px 14px 10px;margin-bottom:12px}
.chart-box svg{width:100%;height:auto;display:block}
.axis-lbl{font-size:10px;fill:var(--muted);font-family:inherit;font-weight:400}

/* ---------- muscle map ---------- */
.muscle-svg path.m{fill:#333336;stroke:var(--card);stroke-width:1;cursor:pointer;transition:fill .3s}
.muscle-svg path.body{fill:#26262a;stroke:var(--line);stroke-width:1}
.muscle-svg path.m.i1{fill:rgba(41,151,255,.35)} .muscle-svg path.m.i2{fill:rgba(41,151,255,.65)} .muscle-svg path.m.i3{fill:var(--link)}

/* misc */
.divider{height:1px;background:var(--line);margin:16px 0}
.tag{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.02em;border-radius:9999px;padding:5px 11px;white-space:nowrap}
.tag.acc{background:var(--accent-dim);color:var(--link)}
.tag.gold{background:var(--card3);color:var(--text)}
.tag.red{background:var(--danger-dim);color:var(--danger)}
input[type=text],input[type=number],input[type=date],select{background:var(--card2);border:none;color-scheme:dark;border-radius:16px;color:var(--text);
  font-family:inherit;font-size:16px;font-weight:600;padding:13px 16px;width:100%;outline:none;-webkit-appearance:none}
label.fld{display:block;margin-bottom:12px}
label.fld span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.count-anim{transition:none}
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--card3);border-radius:99px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(20px);background:var(--accent-ink)}
.emo{width:46px;height:46px;border-radius:50%;background:var(--card3);display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

/* ---------- refero-style multicolour text sweep ---------- */
.hsweep{background:linear-gradient(90deg,#0090f7,#ba62fc,#f2416b,#f55600,#f5f5f7,#f5f5f7);
  background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:hsweep 1.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes hsweep{0%{background-position:0% 0}100%{background-position:100% 0}}
.quote-card{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;min-height:96px}
.quote-card .qtxt{font-family:"SF Pro Display",-apple-system,sans-serif;font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.011em;transition:opacity .35s}
.quote-card .qwho{font-size:13px;font-weight:400;letter-spacing:.02em;color:var(--muted);margin-top:10px}
.quote-card.fade .qtxt,.quote-card.fade .qwho{opacity:0}
</style>
</head>
<body>

<div id="app">
  <div id="screen-today" class="screen active"></div>
  <div id="screen-progress" class="screen"></div>
  <div id="screen-awards" class="screen"></div>
  <div id="screen-profile" class="screen"></div>
</div>

<nav id="tabbar">
  <span id="tab-ind"></span>
  <button class="tab active" data-tab="today">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg>Today</button>
  <button class="tab" data-tab="progress">
    <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V12"/><path d="M10 21V7"/><path d="M15 21v-9"/><path d="M20 21V4"/></svg>Progress</button>
  <button class="tab train" data-tab="train">
    <span class="train-btn"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span>Train</button>
  <button class="tab" data-tab="awards">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-2.5L17 22l-1.5-8"/></svg>Awards</button>
  <button class="tab" data-tab="profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
</nav>

<div id="workout-overlay" class="overlay"></div>
<div id="post-overlay" class="overlay"></div>
<div id="sheet-veil"></div>
<div id="sheet"></div>
<div id="toast-zone"></div>

<script>
"use strict";
/* ================================================================
   FORGE — personal gamified strength app. All data lives in
   localStorage and every number on screen derives from logged sets.
   ================================================================ */

const EXERCISES = {
  "incline-bench":{name:"Low-Incline Barbell Bench Press",short:"Low-Incline Bench",inc:2.5,groups:["chest","shoulders","arms"],unit:"kg"},
  "dips":{name:"Dips",short:"Dips",inc:2.5,groups:["chest","arms"],unit:"+kg"},
  "lateral-raise":{name:"DB Lateral Raise",short:"Lateral Raise",inc:1,groups:["shoulders"],unit:"kg"},
  "barbell-row":{name:"Barbell Row",short:"Barbell Row",inc:2.5,groups:["upperback","lats"],unit:"kg"},
  "lat-pulldown":{name:"Cable Lat Pulldown",short:"Lat Pulldown",inc:2.5,groups:["lats","upperback"],unit:"kg"},
  "shrug":{name:"Barbell Shrug",short:"Shrug",inc:2.5,groups:["traps","upperback"],unit:"kg"},
  "light-squat":{name:"Bodyweight / Light Squat",short:"Light Squat",inc:2.5,groups:["quads","glutes"],unit:"+kg"},
  "adductor-iso":{name:"Adductor Squeeze (isometric)",short:"Adductor Iso",inc:1,groups:["glutes"],unit:"+kg",timed:true},
  "glute-bridge":{name:"Glute Bridge",short:"Glute Bridge",inc:2.5,groups:["glutes","hamstrings"],unit:"+kg"},
  "calf-raise":{name:"Standing Calf Raise",short:"Calf Raise",inc:2.5,groups:["calves"],unit:"kg"},
  "ohp":{name:"Standing Barbell Overhead Press",short:"OHP",inc:2.5,groups:["shoulders","traps"],unit:"kg"},
  "curl":{name:"DB / Barbell Curl",short:"Curl",inc:1,groups:["arms"],unit:"kg"},
  "tricep-pushdown":{name:"Cable Triceps Pushdown",short:"Triceps Pushdown",inc:2.5,groups:["arms"],unit:"kg"},
  "db-row-1arm":{name:"Heavy 1-Arm DB Row",short:"1-Arm DB Row",inc:2.5,groups:["lats","upperback"],unit:"kg",per:"side"},
  "cable-row-high":{name:"Face Pull",short:"Face Pull",inc:2.5,groups:["upperback","shoulders"],unit:"kg"},
  "front-squat":{name:"Front Squat",short:"Front Squat",inc:2.5,groups:["quads","core"],unit:"kg"},
  "rdl":{name:"Romanian Deadlift",short:"RDL",inc:2.5,groups:["hamstrings","glutes"],unit:"kg"},
  "cable-crunch":{name:"Cable Crunch",short:"Cable Crunch",inc:2.5,groups:["core"],unit:"kg"},
  // retired from the current programme — kept so old sessions, PRs and charts still render
  "bss":{name:"Bulgarian Split Squat",short:"Bulgarian Split Squat",inc:2.5,groups:["quads","glutes"],unit:"kg",per:"leg",legacy:true},
};
const ACTIVE_EX = Object.keys(EXERCISES).filter(k=>!EXERCISES[k].legacy);
// prescription: sets, rep range, rest seconds, RIR, upAt = total-rep threshold to add weight
const P=(sets,repLo,repHi,rest,rir,upAt)=>({sets,repLo,repHi,rest,rir,upAt});
const WORKOUTS = {
  A:{title:"Chest / Push Strength",ex:["incline-bench","dips","lateral-raise"],
     p:{"incline-bench":P(5,4,6,180,"1–2",27),"dips":P(4,6,12,150,"1–2",44),"lateral-raise":P(4,12,20,75,"0–2")}},
  B:{title:"Back Thickness / Traps",ex:["barbell-row","lat-pulldown","shrug"],
     p:{"barbell-row":P(5,5,8,150,"1–2",35),"lat-pulldown":P(4,8,12,120,"1–2"),"shrug":P(4,8,15,105,"1–2")}},
  C:{title:"Lower Rehab / Reconditioning",ex:["light-squat","adductor-iso","glute-bridge","calf-raise"],
     note:"Finish with 5–10 min of gentle hip, ankle, adductor and hip-flexor mobility. No aggressive stretching or painful loading.",
     p:{"light-squat":P(3,8,12,90,"3+"),"adductor-iso":P(3,20,40,60,"—"),"glute-bridge":P(3,10,15,75,"2–3"),"calf-raise":P(4,12,20,75,"0–2")}},
  D:{title:"Shoulders / Arms",ex:["ohp","lateral-raise","curl","tricep-pushdown"],superset:["curl","tricep-pushdown"],
     p:{"ohp":P(4,5,8,150,"1–2",28),"lateral-raise":P(4,12,20,75,"0–2"),"curl":P(4,8,15,75,"0–2"),"tricep-pushdown":P(4,8,15,75,"0–2")}},
  E:{title:"Back Width / Traps",ex:["db-row-1arm","lat-pulldown","shrug","cable-row-high"],
     p:{"db-row-1arm":P(4,8,12,120,"1–2"),"lat-pulldown":P(4,8,12,120,"1–2"),"shrug":P(4,10,15,105,"1–2"),"cable-row-high":P(3,12,20,75,"0–2")}},
  F:{title:"Chest / Push Volume",ex:["incline-bench","dips","lateral-raise"],
     p:{"incline-bench":P(4,7,10,150,"1–2"),"dips":P(3,8,15,120,"1–2"),"lateral-raise":P(4,12,20,75,"0–2")}},
  G:{title:"Lower Strength",ex:["front-squat","rdl","calf-raise","cable-crunch"],
     note:"Front squat: conservative loading. Progress only if groin and knees tolerate the session and feel good afterwards.",
     p:{"front-squat":P(3,5,8,180,"2–3"),"rdl":P(4,6,10,150,"1–2",34),"calf-raise":P(4,10,20,75,"0–2"),"cable-crunch":P(3,10,20,75,"0–2")}},
};
const CYCLE = ["A","B","C","D","E","F","G"];
// legacy workout letters from earlier programmes so old sessions still render
const LEGACY_WORKOUTS={};
function wkDef(w){ return WORKOUTS[w]||LEGACY_WORKOUTS[w]||{title:"Workout "+w,ex:[],p:{}}; }
function presc(ex,wk){
  if(wk&&WORKOUTS[wk]&&WORKOUTS[wk].p[ex]) return WORKOUTS[wk].p[ex];
  for(const w of CYCLE) if(WORKOUTS[w].p[ex]) return WORKOUTS[w].p[ex];
  return P(3,8,12,120,"1–2");
}
function primaryWorkoutOf(ex){ for(const w of CYCLE) if(WORKOUTS[w].p[ex]) return w; return null; }
function schemeSig(ex,wk){ const p=presc(ex,wk); return p.sets+"x"+p.repLo+"-"+p.repHi; }
function upThreshold(ex,wk){ const p=presc(ex,wk); return p.upAt||p.sets*p.repHi; }
const GROUPS = {
  chest:"Chest", upperback:"Upper Back", lats:"Lats", shoulders:"Shoulders", traps:"Traps",
  arms:"Arms", core:"Core", quads:"Quads", hamstrings:"Hamstrings", glutes:"Glutes", calves:"Calves",
};
const SCORE_GROUPS = {
  "Chest":["incline-bench","dips"],
  "Upper Back":["barbell-row","lat-pulldown","db-row-1arm","shrug","cable-row-high"],
  "Shoulders":["ohp","lateral-raise"],
  "Arms":["curl","tricep-pushdown"],
  "Lower Body":["front-squat","light-squat","calf-raise"],
  "Posterior Chain":["rdl","glute-bridge"],
  "Core":["cable-crunch"],
};
const EX_LEVELS = ["Recruit","Novice","Trained","Strong","Powerful","Elite"];
const EX_LEVEL_XP = [0,150,400,800,1400,2200]; // cumulative XP to reach level i+1
const XP = {SET:10, EXERCISE:25, WORKOUT:100, PR:50, CYCLE:250, MASTER:40, RECOVERY:30, PERFECT:50,
  WALK:15, STEPS_5K:20, STEPS_10K:40, STEPS_15K:40, KCAL_GOAL:30, MOVE_DAY:60};

/* ---------------- state ---------------- */
const DB_KEY = "forge.v1";
let S = null;

function freshState(){
  return {
    profile:{name:"Joe",age:30,heightCm:193,startWeightKg:95,avatar:null},
    settings:{windowHours:48,restSec:0,sound:true,haptics:true,notify:false,goals:{steps:10000,kcal:600,water:3000},walk:{every:2.5,from:8,to:20,on:true}},
    nextWorkout:"A",
    programmeVersion:3,
    xp:0,
    exState:Object.fromEntries(Object.keys(EXERCISES).map(k=>[k,{weight:null,xp:0,mastered:[]}])),
    sessions:[],        // {id,workout,dateISO,start,end,dur,sets:[{ex,w,reps}],volume,xp,prs:[{ex,type,label}]}
    prs:{},             // ex -> {heaviest:{w,reps,date}, e1rm:{v,w,reps,date}, repsAt:{"80":{reps,date}}, sesVol:{v,date}, best5:{v,date}}
    prLog:[],           // {date,ex,type,label}
    streak:{cur:0,longest:0,lastEnd:null,windowEnds:null,tokens:0,tokenProgress:0,history:[],startedAt:null,protectedDates:[]},
    recovery:[],        // active rest days: {date,ts,type,value}
    health:[],          // {date,steps,kcal,water}
    walks:[],           // {date,ts,mins}
    moveStreak:{cur:0,longest:0,lastDay:null},
    buffs:{},           // {doubleNext:true} etc
    relics:[],          // rare collectibles {id,date}
    crates:[],          // {date,reward,grade}
    redemption:null,    // {until,lost,target,done}
    xpLog:[],           // [{ts,amount,reason}] — backfilled from sessions on first load
    quests:{date:null,done:{},perfect:false},  // per-day quest completion
    league:{tier:0,weekKey:null,best:0,history:[]},
    bodyLogs:[],        // {date,weight,waist,chest,arms,thighs}
    photos:[],          // {id,date,type,dataUrl}
    achievements:{},    // id -> ts
    cycles:0,
    workoutsDone:0,
    scoreHistory:[],    // {date,score}
    activeSession:null, // in-progress workout (survives refresh)
  };
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }catch(e){ console.warn("save failed",e);} }
function load(){
  try{ const raw = localStorage.getItem(DB_KEY); S = raw ? JSON.parse(raw) : freshState(); }
  catch(e){ S = freshState(); }
  const hadState = !!S.sessions && S.sessions.length>=0 && S.programmeVersion!==undefined;
  const priorVersion = S.programmeVersion;
  // forward-compat: fill any missing keys
  const f = freshState();
  for(const k in f) if(S[k]===undefined) S[k]=f[k];
  for(const k in f.exState) if(!S.exState[k]) S.exState[k]=f.exState[k];
  if(!S.xpLog||(S.xpLog.length===0&&S.sessions.length)){ S.xpLog=S.sessions.map(x=>({ts:x.end||x.id,amount:x.xp,reason:"Workout "+x.workout})); }
  if(priorVersion!==3){ S.programmeVersion=3; if(S.sessions.length) S.nextWorkout="B"; }  // existing users start the new plan at B
  if(!CYCLE.includes(S.nextWorkout)) S.nextWorkout="A";
  if(S.activeSession && (!WORKOUTS[S.activeSession.workout] || S.activeSession.sets.some(x=>!WORKOUTS[S.activeSession.workout].ex.includes(x.ex)))) S.activeSession=null;
  if(!S.quests) S.quests={date:null,done:{},perfect:false};
  if(!S.health) S.health=[];
  if(!S.walks) S.walks=[];
  if(!S.moveStreak) S.moveStreak={cur:0,longest:0,lastDay:null};
  if(!S.settings.walk) S.settings.walk={every:2.5,from:8,to:20,on:true};
  if(!S.settings.goals) S.settings.goals={steps:10000,kcal:600,water:3000};
  if(!S.buffs) S.buffs={}; if(!S.relics) S.relics=[]; if(!S.crates) S.crates=[];
  if(S.redemption===undefined) S.redemption=null;
  if(!S.league) S.league={tier:0,weekKey:null,best:0,history:[]};
}

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const el = (id) => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const abbr = n => n>=10000?(n/1000).toFixed(0)+'k':n>=1000?(n/1000).toFixed(1)+'k':String(n);
const fmtKg = v => (Math.round(v*10)/10).toLocaleString("en-GB");
const dayISO = ts => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => new Date(iso+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtDateShort = iso => new Date(iso+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtDur = s => { const m=Math.floor(s/60), sec=Math.floor(s%60); return m+":"+String(sec).padStart(2,"0"); };
const fmtTimer = ms => { if(ms<=0) return "00:00:00"; const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), sec=Math.floor(ms%60000/1000);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); };
const fmtClock = ms => {
  if(ms<=0) return "0h 0m";
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  return h+"h "+String(m).padStart(2,"0")+"m";
};
const e1rm = (w,r) => r>0 ? w*(1+r/30) : 0;
const sum = a => a.reduce((x,y)=>x+y,0);
function haptic(pattern){ if(S.settings.haptics && navigator.vibrate) navigator.vibrate(pattern||18); }
let AC=null;
function beep(freq=880,dur=.12,when=0,type="sine",gain=.12){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime+when;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sndSet   = ()=>{ beep(720,.09); };
const sndPR    = ()=>{ beep(660,.1); beep(880,.1,.1); beep(1108,.22,.2); };
const sndDone  = ()=>{ beep(523,.12); beep(659,.12,.12); beep(784,.12,.24); beep(1046,.3,.36); };
const sndTimer = ()=>{ beep(980,.15); beep(980,.15,.25); beep(980,.3,.5); };

function toast(msg,acc){
  const z = el("toast-zone");
  const t = document.createElement("div");
  t.className="toast"+(acc?" acc":"");
  t.innerHTML=msg;
  z.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s,transform .4s"; t.style.opacity="0"; t.style.transform="translateY(-10px)"; },2600);
  setTimeout(()=>t.remove(),3100);
}
function countUp(node,to,dur=800,fmt){
  const start=performance.now();
  function tick(now){
    const p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3);
    const v=to*e;
    node.textContent = fmt?fmt(v):Math.round(v).toLocaleString("en-GB");
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------------- level maths ---------------- */
function levelInfo(xp){
  // level n requires 500*n XP to clear (n=1..): thresholds 500,1500,3000,5000...
  let lvl=1, need=500, base=0;
  while(xp >= base+need){ base+=need; lvl++; need=500*lvl; }
  return {lvl, into:xp-base, need, pct:Math.min(100,Math.round((xp-base)/need*100))};
}
function exLevelInfo(xp){
  let li=0;
  for(let i=EX_LEVEL_XP.length-1;i>=0;i--){ if(xp>=EX_LEVEL_XP[i]){ li=i; break; } }
  const curBase=EX_LEVEL_XP[li], next=EX_LEVEL_XP[li+1];
  const maxed = next===undefined;
  return {lvl:li+1, name:EX_LEVELS[li], maxed,
    pct: maxed?100:Math.round((xp-curBase)/(next-curBase)*100),
    toNext: maxed?0:next-xp};
}

/* ---------------- PR engine ---------------- */
function checkSetPRs(ex,w,reps,dateISO,hadHistOverride){
  // returns list of PR objects triggered by one set
  if(reps<=0) return [];
  const p = S.prs[ex] = S.prs[ex] || {heaviest:null,e1rm:null,repsAt:{},sesVol:null,best5:null};
  const out=[];
  const hadHistory = hadHistOverride!==undefined?hadHistOverride:exposuresOf(ex).length>0;
  if(w>0 && (!p.heaviest || w>p.heaviest.w)){
    const prev=p.heaviest; p.heaviest={w,reps,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"weight",label:`${fmtKg(w)}kg — heaviest ever`,delta:`+${fmtKg(w-prev.w)}kg`});
  }
  const est=e1rm(w,reps);
  if(w>0 && (!p.e1rm || est>p.e1rm.v+0.01)){
    const prev=p.e1rm; p.e1rm={v:est,w,reps,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"e1rm",label:`Est. 1RM ${fmtKg(est)}kg`,delta:`+${fmtKg(est-prev.v)}kg`});
  }
  const key=String(w);
  const ra=p.repsAt[key];
  if(!ra || reps>ra.reps){
    if(ra&&hadHistory){
      const d=EXERCISES[ex]||{}, u=d.timed?"sec":"rep";
      const lbl = w>0?`${fmtKg(w)}${d.unit==="+kg"?"kg added":"kg"} \u00D7 ${reps}`:(d.timed?`${reps} sec hold`:`bodyweight \u00D7 ${reps}`);
      out.push({ex,type:"reps",label:lbl,delta:`+${reps-ra.reps} ${u}${reps-ra.reps>1?"s":""}`});
    }
    p.repsAt[key]={reps,date:dateISO};
  }
  return out;
}
function checkSessionPRs(ex,sets,dateISO,hadHistOverride){
  const p = S.prs[ex]; if(!p) return [];
  const out=[];
  const vol = sum(sets.map(s=>s.w*s.reps));
  const hadHistory = hadHistOverride!==undefined?hadHistOverride:exposuresOf(ex).length>0;
  if(vol>0 && (!p.sesVol || vol>p.sesVol.v)){
    const prev=p.sesVol; p.sesVol={v:vol,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"volume",label:`${fmtKg(vol)}kg session volume`,delta:`+${fmtKg(vol-prev.v)}kg`});
  }
  const top5 = sets.map(s=>s.w*s.reps).sort((a,b)=>b-a).slice(0,5);
  const b5 = sum(top5);
  if(b5>0 && (!p.best5 || b5>p.best5.v)){
    const prev=p.best5; p.best5={v:b5,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"best5",label:`Best 5-set performance`,delta:`+${fmtKg(b5-prev.v)}kg`});
  }
  return out;
}

/* ---------------- history helpers ---------------- */
function exposuresOf(ex,wk){
  // chronological list of {date,sets:[{w,reps}],volume,totalReps,topW}; wk filters to one workout letter
  const out=[];
  const want = wk?schemeSig(ex,wk):null;
  for(const s of S.sessions){
    if(want && schemeSig(ex,s.workout)!==want) continue;
    const sets = s.sets.filter(x=>x.ex===ex);
    if(!sets.length) continue;
    out.push({date:s.dateISO, workout:s.workout, sets, volume:sum(sets.map(x=>x.w*x.reps)),
      totalReps:sum(sets.map(x=>x.reps)), topW:Math.max(...sets.map(x=>x.w)),
      bestE1:Math.max(...sets.map(x=>e1rm(x.w,x.reps)))});
  }
  return out;
}
function lastExposure(ex,wk){ let e=exposuresOf(ex,wk); if(!e.length&&wk) e=exposuresOf(ex); return e.length?e[e.length-1]:null; }
function targetFor(ex,wk){
  const def=EXERCISES[ex], st=S.exState[ex], pr=presc(ex,wk);
  const sameScheme=exposuresOf(ex,wk); // only compare against sessions of this workout (same rep scheme)
  const last=sameScheme.length?sameScheme[sameScheme.length-1]:null;
  const anyLast=lastExposure(ex);
  if(!last){
    // seen in another workout: carry the weight across as a starting point
    return {mode:"first", weight:anyLast?anyLast.topW:st.weight, text:anyLast?`First ${pr.sets}×${pr.repLo}–${pr.repHi} session — start around ${fmtKg(anyLast.topW)}${def.unit}`:"First session — establish your working weight.", detail:`Target ${pr.sets} × ${pr.repLo}–${pr.repHi} · ${pr.rir} RIR`};
  }
  const thr=upThreshold(ex,wk);
  const topReps = last.totalReps>=thr && last.sets.length>=pr.sets;
  if(topReps){
    const next=last.topW+def.inc;
    return {mode:"increase", weight:next, prevW:last.topW,
      text:`${fmtKg(last.topW)}${def.unit} mastered — move up`, detail:`${last.totalReps} clean reps cleared ${thr}. New target: ${fmtKg(next)}${def.unit} × ${pr.sets}×${pr.repLo}–${pr.repHi}`};
  }
  return {mode:"beat", weight:last.topW, prevReps:last.totalReps,
    text:`Beat ${last.totalReps} total reps`, detail:`Last time: ${fmtKg(last.topW)}${def.unit} — ${last.sets.map(x=>x.reps).join(" / ")}`};
}

function windowMs(){ return S.settings.windowHours*3600000; }
function lastActivityTs(){
  const st=S.streak;
  const recTs=S.recovery.length?Math.max(...S.recovery.map(r=>r.ts)):0;
  return Math.max(st.lastEnd||0, recTs);
}
function recoveryDaysSinceWorkout(){
  // distinct active-recovery dates logged since the last workout
  const cut=S.streak.lastEnd||0;
  return new Set(S.recovery.filter(r=>r.ts>cut).map(r=>r.date)).size;
}
function streakState(){
  const st=S.streak;
  if(!st.cur || !st.windowEnds) return {status:"none"};
  const left = st.windowEnds - Date.now();
  if(left<=0) return {status:"expired"};
  const h=left/3600000;
  const sinceAct=(Date.now()-lastActivityTs())/3600000;
  let tier="strong", msg="Momentum strong.";
  if(h<=1){ tier="critical"; msg=`${st.cur} workouts. Don't throw it away now.`; }
  else if(h<=6){ tier="danger"; msg=`Don't lose your ${st.cur}-workout streak.`; }
  else if(sinceAct>=40){ tier="danger"; msg=`🚨 Second day with no activity. Train or move — now.`; }
  else if(h<=12){ tier="due"; msg="Your next session is due."; }
  else if(sinceAct>=24){ tier="due"; msg="No activity logged yesterday. Train or log active recovery."; }
  else if(h<=24){ tier="soon"; msg="Momentum holding. Train today."; }
  return {status:"live",left,tier,msg,sinceAct,pct:Math.max(0,Math.min(100,left/windowMs()*100))};
}
function handleExpiry(){
  const st=S.streak;

  breakStreak();
}
function redemptionActive(){ return !!(S.redemption && !S.redemption.done && Date.now()<S.redemption.until); }
function breakStreak(){
  const st=S.streak;
  const days = st.startedAt ? Math.max(1,Math.round((Date.now()-st.startedAt)/86400000)) : 0;
  const prsIn = S.prLog.filter(p=>st.startedAt && new Date(p.date+"T12:00").getTime()>=st.startedAt-86400000).length;
  const lost={len:st.cur,days,prs:prsIn,ended:dayISO(Date.now()),started:st.startedAt?dayISO(st.startedAt):null};
  st.history.push(lost);
  st.cur=0; st.windowEnds=null; st.startedAt=null;
  S.redemption={until:Date.now()+7*86400000,lost:lost.len,target:Math.min(5,Math.max(3,Math.round(lost.len/4))),count:0,done:false};
  save();
  showStreakLost(lost);
}

/* ---------------- strength score ---------------- */
function computeScore(){
  // Per group: progression of best e1RM vs personal baseline (first 2 exposures avg),
  // plus small recency/consistency factor. Gamified, self-relative.
  const breakdown={}; let totalW=0, totalV=0;
  for(const [g,exs] of Object.entries(SCORE_GROUPS)){
    let ratios=[], trained=0;
    for(const ex of exs){
      const exp=exposuresOf(ex);
      if(!exp.length) continue;
      trained++;
      const baseArr=exp.slice(0,Math.min(2,exp.length));
      const base=sum(baseArr.map(e=>e.bestE1))/baseArr.length || 1;
      const curArr=exp.slice(-2);
      const cur=sum(curArr.map(e=>e.bestE1))/curArr.length;
      ratios.push(base>0?cur/base:1);
    }
    if(!ratios.length){ breakdown[g]=0; continue; }
    const r=sum(ratios)/ratios.length;
    const freq=Math.min(1, exs.reduce((n,ex)=>n+exposuresOf(ex).length,0)/ (exs.length*4));
    const sc=Math.round(Math.min(99, 50*r + 20*freq + (r-1)*120 ));
    breakdown[g]=Math.max(1,sc);
    totalW+=1; totalV+=breakdown[g];
  }
  const overall = totalW? Math.round(totalV/totalW*10) : 0;
  return {overall,breakdown};
}
function scoreOnDate(iso){
  const h=S.scoreHistory.filter(x=>x.date<=iso);
  return h.length?h[h.length-1].score:null;
}

function todaySession(){ const d=dayISO(Date.now()); return S.sessions.filter(x=>x.dateISO===d).pop()||null; }
function dailyQuests(){
  const d=dayISO(Date.now());
  const ses=todaySession();
  const rec=S.recovery.some(r=>r.date===d);
  const nw=ses?ses.workout:S.nextWorkout;
  const q=[];
  // 1. show up
  q.push({id:"show",title:ses?`Workout ${ses.workout} complete`:rec?"Active recovery logged":`Complete Workout ${nw}`,
    sub:ses?wkDef(ses.workout).title:rec?"Rest day — momentum held":`${WORKOUTS[nw].ex.map(e=>EXERCISES[e].short).join(" + ")} · or log active recovery`,
    xp:25,done:!!(ses||rec),action:ses?null:rec?null:"startOrResumeWorkout()"});
  if(!rec||ses){
    // 2. beat previous on first exercise of the workout
    const ex=WORKOUTS[nw].ex[0], def=EXERCISES[ex];
    const exp=exposuresOf(ex,nw);
    let beat=false;
    if(ses){ const cur=exp[exp.length-1], prev=exp[exp.length-2]; if(cur&&prev&&cur.date===d) beat=cur.totalReps>prev.totalReps||cur.topW>prev.topW||cur.bestE1>prev.bestE1+.01; }
    const last=lastExposure(ex,nw);
    q.push({id:"beat",title:`Beat last ${def.short} session`,sub:last&&!ses?`Last: ${fmtKg(last.topW)}${def.unit} — ${last.totalReps} total reps`:ses?(beat?"Past you: defeated":"Not this time — next session"):"First exposure — set the bar",xp:25,done:beat,action:ses?`openExercise('${ex}')`:"startOrResumeWorkout()"});
    // 3. every set in range
    let inRange=false;
    if(ses){ inRange=ses.sets.every(st=>st.reps>=presc(st.ex,ses.workout).repLo); }
    q.push({id:"range",title:"Every set inside the rep range",sub:ses?(inRange?"Clean session":"A set fell below range"):"No junk sets — hit the prescribed reps",xp:20,done:inRange,action:ses?`openSession('${ses.id}')`:"startOrResumeWorkout()"});
  } else {
    // rest-day alternatives
    const lastS=S.sessions[S.sessions.length-1];
    q.push({id:"review",title:"Review your last session",sub:lastS?`Workout ${lastS.workout} · ${fmtDateShort(lastS.dateISO)}`:"No sessions yet",xp:10,done:!!S.quests.done.review,action:lastS?`markQuest('review');openSession('${lastS.id}')`:null});
    const nx=WORKOUTS[S.nextWorkout].ex[0];

  }

let emberRAF=null;
/* forge tiers — the card physically heats up as the streak grows */
const FORGE_TIERS=[
  {min:0,  name:"Cold iron", n:16, spd:.30, life:.85, hue:[18,32],  glow:.05, spark:0,   arc:0},
  {min:3,  name:"Ember",     n:34, spd:.42, life:1.0, hue:[16,34],  glow:.10, spark:.02, arc:0},
  {min:8,  name:"Kindled",   n:56, spd:.55, life:1.15,hue:[14,38],  glow:.16, spark:.05, arc:0},

  {min:30, name:"Molten",    n:110,spd:.86, life:1.45,hue:[10,50],  glow:.34, spark:.14, arc:.004},
  {min:50, name:"White hot", n:140,spd:1.02,life:1.6, hue:[8,58],   glow:.46, spark:.20, arc:.012},
  {min:100,name:"Immortal",  n:170,spd:1.18,life:1.75,hue:[6,60],   glow:.58, spark:.28, arc:.024},
];
function forgeTier(){
  const c=S.streak.cur; let t=FORGE_TIERS[0];
  for(const f of FORGE_TIERS) if(c>=f.min) t=f;
  return t;
}
function startEmbers(){
  stopEmbers();
  const host=document.querySelector(".streak-hero"); if(!host) return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas"); c.className="embers"; host.prepend(c);
  const dpr=Math.min(2,devicePixelRatio||1);
  const W=host.clientWidth, H=host.clientHeight;
  if(!W||!H) return;
  c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const danger=host.classList.contains("danger");
  const T=forgeTier();
  const heat=Math.min(1,S.streak.cur/60);

  const P=[],SPK=[],ARC=[];
  function spawn(init){
    return {x:Math.random()*W, y:init?Math.random()*H:H+6,
      vx:(Math.random()-.5)*.28, vy:-(.20+Math.random()*.55)*T.spd,
      r:.5+Math.random()*1.9, a:(.20+Math.random()*.55)*T.life, ph:Math.random()*Math.PI*2,
      hue:T.hue[0]+Math.random()*(T.hue[1]-T.hue[0]), wob:.4+Math.random()*1.1};
  }
  for(let i=0;i<T.n;i++) P.push(spawn(true));
  let t=0;
  (function tick(){
    t+=.016;
    x.clearRect(0,0,W,H);

    // molten glow rising from the base of the card
    if(T.glow>0){
      const g=x.createLinearGradient(0,H,0,H*(1-.55-heat*.2));
      const col=danger?"255,69,58":"255,"+Math.round(90+heat*70)+",30";
      g.addColorStop(0,`rgba(${col},${T.glow})`);
      g.addColorStop(.55,`rgba(${col},${T.glow*.28})`);
      g.addColorStop(1,`rgba(${col},0)`);
      x.fillStyle=g; x.fillRect(0,0,W,H);
    }

    // embers
    x.globalCompositeOperation="lighter";
    for(const p of P){
      p.x+=p.vx+Math.sin(t*p.wob+p.ph)*.35;
      p.y+=p.vy;
      p.vy-=.0016;                       // accelerate as they rise
      if(p.y<-8||p.x<-20||p.x>W+20) Object.assign(p,spawn(false));
      const fade=Math.min(1,p.y/(H*.42));   // cool off near the top
      const hue=danger?4:p.hue;
      const light=danger?58:(52+heat*30);
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.4);
      g.addColorStop(0,`hsla(${hue},100%,${light}%,${p.a*fade})`);
      g.addColorStop(.35,`hsla(${hue},100%,${light*.7}%,${p.a*fade*.42})`);
      g.addColorStop(1,`hsla(${hue},100%,40%,0)`);
      x.fillStyle=g; x.beginPath(); x.arc(p.x,p.y,p.r*3.4,0,Math.PI*2); x.fill();
    }

    // crackling sparks that shoot and die
    if(Math.random()<T.spark) SPK.push({x:Math.random()*W,y:H+2,vx:(Math.random()-.5)*2.4,vy:-(2+Math.random()*3.4),life:1});
    for(let i=SPK.length-1;i>=0;i--){
      const p=SPK[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=.055; p.life-=.022;
      if(p.life<=0){ SPK.splice(i,1); continue; }
      x.strokeStyle=`hsla(${danger?4:42},100%,${70+heat*25}%,${p.life})`;
      x.lineWidth=1.4; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(p.x-p.vx*2.4,p.y-p.vy*2.4); x.stroke();
    }

    // arcs of heat across the top at the highest tiers
    if(T.arc&&Math.random()<T.arc){
      const y0=H*(.18+Math.random()*.5);
      ARC.push({x0:-10,y0,seg:Array.from({length:7},(_,i)=>({x:(W+20)*(i/6)-10,y:y0+(Math.random()-.5)*26})),life:1});
    }
    for(let i=ARC.length-1;i>=0;i--){
      const A=ARC[i]; A.life-=.075;
      if(A.life<=0){ ARC.splice(i,1); continue; }
      x.strokeStyle=`hsla(46,100%,88%,${A.life*.55})`; x.lineWidth=1.1;
      x.beginPath(); A.seg.forEach((pt,k)=>k?x.lineTo(pt.x,pt.y):x.moveTo(pt.x,pt.y)); x.stroke();
    }
    x.globalCompositeOperation="source-over";
    emberRAF=requestAnimationFrame(tick);
  })();
}

/* ---------------- session grade ---------------- */
function gradeSession(A,session){
  let got=0,max=0,notes=[];
  for(const ex of WORKOUTS[A.workout].ex){
    const pr=presc(ex,A.workout);
    const sets=session.sets.filter(x=>x.ex===ex);
    if(!sets.length) continue;
    max+=3;
    const exp=exposuresOf(ex,A.workout);
    const prev=exp.length>=2?exp[exp.length-2]:null;
    const cur=exp[exp.length-1];
    if(!prev){ got+=2; }
    else if(cur.totalReps>prev.totalReps||cur.topW>prev.topW||cur.bestE1>prev.bestE1+.01){ got+=2; notes.push(EXERCISES[ex].short+" beaten"); }
    if(sets.length>=pr.sets && sets.every(x=>x.reps>=pr.repLo)){ got+=1; }
  }
  got+=Math.min(3,session.prs.length);  max+=3;
  const pct=max?got/max:0;
  const g=pct>=.9?"S":pct>=.75?"A":pct>=.55?"B":"C";
  return {grade:g,pct:Math.round(pct*100),notes};
}

function rollCrate(grade){
  const rolls=grade==="S"?3:grade==="A"?2:1;   // better grade, better odds
  let best=null;
  for(let i=0;i<rolls;i++){
    const r=Math.random()*100;
    let x;
    if(r<50)      x={t:"xp",v:25+Math.floor(Math.random()*4)*25,rank:1,label:"XP bonus"};
    else if(r<72) x={t:"xp",v:150,rank:2,label:"Big XP bonus"};
    else if(r<86) x={t:"double",rank:3,label:"Double XP next workout"};
    else if(r<95) x={t:"token",rank:4,label:"Recovery token"};
    else          x={t:"relic",rank:5,label:"Relic"};
    if(!best||x.rank>best.rank) best=x;
  }
  if(best.t==="token" && S.streak.tokens>=2) best={t:"xp",v:150,rank:2,label:"Big XP bonus"};
  if(best.t==="relic"){
    const owned=new Set(S.relics.map(r=>r.id));
    const pool=RELICS.filter(r=>!owned.has(r.id));
    if(!pool.length) best={t:"double",rank:3,label:"Double XP next workout"};
    else best.relic=pool[Math.floor(Math.random()*pool.length)];
  }
  return best;
}
function applyCrate(rw){
  if(rw.t==="xp") addXP(rw.v,"Crate bonus");
  else if(rw.t==="double"){ S.buffs.doubleNext=true; }
  else if(rw.t==="token"){ if(S.streak.tokens<2) S.streak.tokens++; }
  else if(rw.t==="relic"){ S.relics.push({id:rw.relic.id,date:dayISO(Date.now())}); }
  S.crates.push({date:dayISO(Date.now()),reward:rw.t});
  save();
}
function openCrateSheet(grade){
  const rw=rollCrate(grade);
  openSheet(`<div style="text-align:center;padding:6px 0 4px">
    <div class="eyebrow">Session reward</div>
    <div id="crate-box" style="font-size:76px;margin:22px 0 6px;cursor:pointer;transition:transform .2s;animation:crateShake 1.6s ease-in-out infinite" onclick="revealCrate()">📦</div>
    <div id="crate-hint" style="color:var(--muted);font-size:15px">Tap to open</div>
    <div id="crate-out"></div>
  </div>`);
  window.__crate=rw;
}
function revealCrate(){
  const rw=window.__crate; if(!rw) return;
  applyCrate(rw);
  const box=el("crate-box"); if(!box) return;
  box.style.animation=""; box.onclick=null;
  box.textContent = rw.t==="relic"?rw.relic.e : rw.t==="token"?"🧊" : rw.t==="double"?"✷" : "⚡";
  box.style.transform="scale(1.18)";
  el("crate-hint").textContent="";
  const big = rw.t==="relic"||rw.t==="token"||rw.t==="double";
  el("crate-out").innerHTML=`<div style="animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both">
    <div style="font-size:24px;font-weight:600;letter-spacing:.007em;margin-top:6px">${rw.t==="xp"?"+"+rw.v+" XP":rw.t==="relic"?rw.relic.n:rw.label}</div>
    <div style="color:var(--muted);font-size:15px;margin-top:6px">${
      rw.t==="xp"?"Straight into the bank.":
      rw.t==="double"?"Your next workout earns double XP.":
      rw.t==="token"?"Banked. It can save a streak.":
      "Rare find — added to your relics."}</div>
    ${big?`<div class="tag acc" style="margin-top:14px">${rw.t==="relic"?"Rare":"Uncommon"}</div>`:""}
    <button class="btn primary" style="margin-top:22px" onclick="closeSheet()">Collect</button>
  </div>`;
  if(big){ sndPR(); haptic([40,70,40,70,120]); celebrateAt(box); } else { sndSet(); haptic(25); }
  window.__crate=null;
  window.__pendingCrate=false;
  renderAll();
}
function celebrateAt(node){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=node.getBoundingClientRect();
  for(let i=0;i<18;i++){
    const d=document.createElement("div");
    const a=Math.random()*Math.PI*2, dist=60+Math.random()*90;
    d.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;width:6px;height:6px;border-radius:2px;
      background:${["#0090f7","#ba62fc","#f2416b","#f55600"][i%4]};z-index:600;pointer-events:none;transition:transform .9s cubic-bezier(.1,.7,.3,1),opacity .9s`;
    document.body.appendChild(d);
    requestAnimationFrame(()=>{ d.style.transform=`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) rotate(${Math.random()*360}deg)`; d.style.opacity="0"; });
    setTimeout(()=>d.remove(),950);
  }
}

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}

function addWater(ml){
  const d=dayISO(Date.now());
  const e=S.health.find(x=>x.date===d);
  if(e) e.water=(e.water||0)+ml; else S.health.push({date:d,steps:0,kcal:0,water:ml});
  save(); haptic(12); renderToday();
  const g=(S.settings.goals&&S.settings.goals.water)||3000;
  const cur=S.health.find(x=>x.date===d).water;
  if(cur>=g && cur-ml<g) toast("💧 Water goal hit",true);
}

/* ---------------- movement: walks, step rewards, move streak ---------------- */
function awardOnce(key,amount,reason){
  const d=dayISO(Date.now());
  if(S.xpLog.some(x=>x.reason===reason&&dayISO(x.ts)===d)) return false;
  addXP(amount,reason); return true;
}
function walksToday(){ const d=dayISO(Date.now()); return S.walks.filter(w=>w.date===d); }
function walkTarget(){
  const w=S.settings.walk||{every:2.5,from:8,to:20};
  return Math.max(1,Math.round((w.to-w.from)/w.every));
}
function nextWalkDue(){
  const cfg=S.settings.walk||{every:2.5,from:8,to:20};
  const now=new Date(); const today=dayISO(Date.now());
  const start=new Date(today+"T00:00"); start.setHours(cfg.from,0,0,0);
  const end=new Date(today+"T00:00"); end.setHours(cfg.to,0,0,0);
  const list=walksToday().sort((a,b)=>a.ts-b.ts);
  let due = list.length ? new Date(list[list.length-1].ts+cfg.every*3600000) : start;
  if(due<start) due=start;
  if(now<start) return {when:start,state:"early"};
  if(now>end || list.length>=walkTarget()) return {when:null,state:"done"};
  return {when:due,state: now>=due?"due":"waiting"};
}
function logWalk(mins){
  const now=Date.now();
  S.walks.push({date:dayISO(now),ts:now,mins});
  addXP(XP.WALK,mins+" min walk");
  haptic([20,40,20]);
  const t=walksToday().length, target=walkTarget();
  evalMoveDay();
  save(); renderAll();
  toast(t>=target?`Walk logged — all ${target} done today 🚶`:`Walk logged · ${t}/${target} today`,true);
}
function moveScoreToday(){
  const d=dayISO(Date.now());
  const h=S.health.find(x=>x.date===d)||{};
  const g=S.settings.goals||{steps:10000,kcal:600};
  const stepPct=Math.min(1,(h.steps||0)/g.steps);
  const walkPct=Math.min(1,walksToday().length/walkTarget());
  const kcalPct=Math.min(1,(h.kcal||0)/g.kcal);
  return {stepPct,walkPct,kcalPct,pct:Math.round((stepPct*.45+walkPct*.35+kcalPct*.20)*100),h,g};
}
function evalMoveDay(){
  const d=dayISO(Date.now()), m=moveScoreToday();
  const h=m.h, g=m.g;
  if((h.steps||0)>=5000) awardOnce("s5",XP.STEPS_5K,"5,000 steps");
  if((h.steps||0)>=10000) awardOnce("s10",XP.STEPS_10K,"10,000 steps");
  if((h.steps||0)>=15000) awardOnce("s15",XP.STEPS_15K,"15,000 steps");
  if((h.kcal||0)>=g.kcal) awardOnce("kc",XP.KCAL_GOAL,"Active calorie goal");
  // a "move day" = 80%+ of the movement score
  if(m.pct>=80){
    const ms=S.moveStreak;
    if(ms.lastDay!==d){
      const y=dayISO(Date.now()-86400000);
      ms.cur = ms.lastDay===y ? ms.cur+1 : 1;
      ms.lastDay=d;
      ms.longest=Math.max(ms.longest,ms.cur);
      addXP(XP.MOVE_DAY,"Move day complete");
      setTimeout(()=>toast(`🚶 Move day ${ms.cur} — +${XP.MOVE_DAY} XP`,true),300);
    }
  }
  save();
}
function moveStreakCur(){
  const ms=S.moveStreak, d=dayISO(Date.now()), y=dayISO(Date.now()-86400000);
  if(ms.lastDay===d||ms.lastDay===y) return ms.cur;
  return 0;
}

        <div style="font-size:13px;color:var(--muted);margin-top:2px">${(m.h.steps||0).toLocaleString("en-GB")} steps · ${t}/${target} walks · ${(m.h.kcal||0)}/${m.g.kcal} kcal</div>
        <div style="font-size:13px;color:${due.state==="due"?"var(--link)":"var(--dim)"};margin-top:3px">${dueTxt}</div>

      <button class="btn ghost small" style="width:100%" onclick="logWalk(15)">＋15 min</button>

  if(!(S.settings.walk&&S.settings.walk.on)) return;

function saveHealth(){
  const d=dayISO(Date.now());
  const st=parseInt(el("hl-steps").value)||0, kc=parseInt(el("hl-kcal").value)||0, wa=parseInt(el("hl-water").value)||0;
  upsertHealth(d,st,kc,wa); closeSheet(); renderAll(); toast("Activity logged",true);
}
function upsertHealth(d,steps,kcal,water){
  const e=S.health.find(x=>x.date===d);
  if(e){ if(steps) e.steps=steps; if(kcal) e.kcal=kcal; if(water) e.water=water; }
  else S.health.push({date:d,steps:steps||0,kcal:kcal||0,water:water||0});
  evalMoveDay();
  // 10k+ steps counts as active recovery automatically
  if(steps>=10000 && !S.recovery.some(r=>r.date===d)){
    S.recovery.push({date:d,ts:Date.now(),type:"steps",value:steps});
    const stk=S.streak;
    if(stk.cur&&stk.windowEnds&&Date.now()<stk.windowEnds&&recoveryDaysSinceWorkout()<=2) stk.windowEnds=Math.max(stk.windowEnds,Date.now()+windowMs());
    if(!S.xpLog.some(x=>x.reason==="Active recovery"&&dayISO(x.ts)===d)) addXP(XP.RECOVERY,"Active recovery");
  }
  save();
}
(function importHealthFromURL(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.has("steps")||q.has("kcal")){
      upsertHealth(dayISO(Date.now()),parseInt(q.get("steps"))||0,parseInt(q.get("kcal"))||0,parseInt(q.get("water"))||0);
      history.replaceState(null,"",location.pathname);
      setTimeout(()=>toast("❤️ Health data imported",true),600);
    }
  }catch(e){}
})();

  el("sheet").classList.add("open"); el("sheet-veil").classList.add("open");

}
function closeSheet(){
  const sh=el("sheet"), v=el("sheet-veil");

/* swipe the sheet down to dismiss (drag the handle, or drag anywhere when scrolled to top) */
(function sheetSwipe(){
  const sheet=el("sheet"), veil=el("sheet-veil");
  let y0=0, dy=0, drag=false;
  const reset=()=>{ sheet.style.transition=""; sheet.style.transform=""; veil.style.opacity=""; };
  sheet.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    const fromHandle=!!e.target.closest("#sheet-head");
    drag = fromHandle || sheet.scrollTop<=0;
    y0=e.touches[0].clientY; dy=0;
    if(drag) sheet.style.transition="none";
  },{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(!drag) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){
      e.preventDefault();
      const d=dy<0?0:Math.pow(dy,.92);
      sheet.style.transform="translateY("+d+"px)";
      veil.style.opacity=String(Math.max(.15,1-dy/500));
    } else if(sheet.scrollTop<=0){ sheet.style.transform=""; }
  },{passive:false});
  const end=()=>{
    if(!drag) return; drag=false;
    sheet.style.transition="transform .28s cubic-bezier(.3,.9,.3,1),opacity .28s";
    if(dy>100){
      sheet.style.transform="translateY(110%)";
      veil.style.opacity="0";
      setTimeout(()=>{ closeSheet(); reset(); },230);
    } else reset();
    dy=0;
  };
  sheet.addEventListener("touchend",end);
  sheet.addEventListener("touchcancel",end);
})();

function nearestAchievements(n){
  const out=[];
  for(const a of ACHIEVEMENTS){
    if(S.achievements[a.id]) continue;
    let prog=null;
    if(a.id==="momentum") prog=[S.streak.cur,5];
    else if(a.id==="double-digits") prog=[S.streak.cur,10];
    else if(a.id==="locked-in") prog=[S.streak.cur,25];
    else if(a.id==="unbreakable") prog=[S.streak.cur,50];
    else if(a.id==="immortal") prog=[S.streak.cur,100];
    else if(a.id==="quarter") prog=[S.workoutsDone,25];
    else if(a.id==="fifty") prog=[S.workoutsDone,50];
    else if(a.id==="century") prog=[S.workoutsDone,100];
    else if(a.id==="warrior") prog=[S.cycles,10];
    else if(a.id==="pr-10") prog=[S.prLog.length,10];
    else if(a.id==="pr-machine") prog=[S.prLog.length,25];
    else if(a.id==="pr-50") prog=[S.prLog.length,50];
    if(prog && prog[0]>0) out.push({...a,ratio:prog[0]/prog[1],progress:prog[0]+" / "+prog[1]});

}
function consistency90(){
  if(!S.sessions.length) return 0;
  const now=Date.now();
  const first=new Date(S.sessions[0].dateISO+"T12:00").getTime();
  const span=Math.min(90,Math.max(1,Math.round((now-first)/86400000)+1));
  // expected sessions: one per window (windowHours), capped at 1/day
  const cut=now-90*86400000;
  const activeDays=new Set([
    ...S.sessions.filter(s=>new Date(s.dateISO+"T12:00").getTime()>cut).map(s=>s.dateISO),
    ...S.recovery.filter(r=>new Date(r.date+"T12:00").getTime()>cut).map(r=>r.date),
  ]).size;
  return Math.min(100,Math.round(activeDays/span*100));
}
function heatmapHTML(days){
  const today=new Date(); today.setHours(12,0,0,0);
  const volByDay={};
  for(const s of S.sessions) volByDay[s.dateISO]=(volByDay[s.dateISO]||0)+s.volume;

  const recDays=new Set(S.recovery.map(r=>r.date));
  const vols=Object.values(volByDay).sort((a,b)=>a-b);
  const q=p=>vols.length?vols[Math.min(vols.length-1,Math.floor(vols.length*p))]:0;
  const q1=q(.25),q2=q(.5),q3=q(.75);
  // align to weeks ending today
  const start=new Date(today.getTime()-(days-1)*86400000);
  const startDow=(start.getDay()+6)%7; // Mon=0
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<span></span>`;
  for(let i=0;i<days;i++){
    const d=new Date(start.getTime()+i*86400000);
    const iso=dayISO(d.getTime());
    const v=volByDay[iso];
    let cls="hm-cell";
    if(v){ cls+= v>=q3?" l4": v>=q2?" l3": v>=q1?" l2":" l1"; }
    else if(recDays.has(iso)) cls+=" rec";
    else if(missed.has(iso)) cls+=" miss";
    if(iso===dayISO(Date.now())) cls+=" today";
    cells+=`<span class="${cls}" title="${iso}"></span>`;
  }
  return `<div class="heatmap">${cells}</div>
  <div style="display:flex;gap:14px;margin-top:10px;font-size:10px;color:var(--dim);align-items:center">
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell l3" style="width:9px;height:9px;display:inline-block"></span> trained</span>
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell rec" style="width:9px;height:9px;display:inline-block"></span> active rest</span>
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell" style="width:9px;height:9px;display:inline-block"></span> rest</span>
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell miss" style="width:9px;height:9px;display:inline-block"></span> streak broken</span>
  </div>`;
}

/* ---------------- SVG line chart ---------------- */
function lineChart(pts,{w=340,h=160,unit="",accent="var(--accent)",fill=true,mini=false}={}){
  if(pts.length===0) return `<div style="padding:30px 10px;text-align:center;color:var(--dim);font-size:13px">No data yet — log workouts to see progression.</div>`;
  const pad=mini?{l:2,r:6,t:6,b:6}:{l:34,r:10,t:14,b:22};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  if(y0===y1){ y0-=1; y1+=1; }
  const yr=y1-y0; y0-=yr*.12; y1+=yr*.12;
  const X=v=>x1===x0?pad.l+(w-pad.l-pad.r)/2:pad.l+(v-x0)/(x1-x0)*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-(v-y0)/(y1-y0)*(h-pad.t-pad.b);
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(x1).toFixed(1)} ${h-pad.b} L${X(x0).toFixed(1)} ${h-pad.b} Z`;
  const gid="g"+Math.random().toString(36).slice(2,8);
  let grid="";
  if(!mini) for(let i=0;i<=3;i++){
    const gy=pad.t+(h-pad.t-pad.b)*i/3;
    const gv=y1-(y1-y0)*i/3;
    grid+=`<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="rgba(255,255,255,.06)"/>
    <text x="${pad.l-6}" y="${gy+3}" text-anchor="end" class="axis-lbl">${Math.round(gv)}</text>`;
  }
  const xl=pts.length>1&&!mini?`<text x="${pad.l}" y="${h-6}" class="axis-lbl">${fmtDateShort(dayISO(x0))}</text>
  <text x="${w-pad.r}" y="${h-6}" text-anchor="end" class="axis-lbl">${fmtDateShort(dayISO(x1))}</text>`:"";
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(41,151,255,.18)"/><stop offset="1" stop-color="rgba(41,151,255,0)"/></linearGradient>
      <linearGradient id="${gid}s" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0090f7"/><stop offset=".33" stop-color="#ba62fc"/><stop offset=".66" stop-color="#f2416b"/><stop offset="1" stop-color="#f55600"/></linearGradient>
    </defs>
    ${grid}
    ${fill?`<path d="${area}" fill="url(#${gid})"/>`:""}
    <path d="${path}" fill="none" stroke="url(#${gid}s)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.length<=40&&!mini?pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="var(--bg)" stroke="#fff" stroke-width="1.6"/>`).join(""):""}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5" fill="#f55600" stroke="#fff" stroke-width="2"/>
    ${xl}
  </svg>`;
}

function barChart(items,{w=340,h=150,fmt=v=>fmtKg(v)}={}){
  if(!items.length||items.every(i=>!i.value)) return `<div style="padding:30px 10px;text-align:center;color:var(--dim);font-size:13px">No training logged yet.</div>`;
  const pad={l:8,r:8,t:24,b:20};
  const max=Math.max(...items.map(i=>i.value))||1;
  const bw=(w-pad.l-pad.r)/items.length;
  let bars="";
  items.forEach((it,i)=>{
    const bh=Math.max(2,(h-pad.t-pad.b)*it.value/max);
    const x=pad.l+i*bw+bw*.18, y=h-pad.b-bh;
    const isLast=i===items.length-1;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="3"
      fill="${isLast?"var(--link)":it.value===max?"rgba(41,151,255,.7)":"rgba(41,151,255,.32)"}"/>`;
    if(isLast||it.value===max) bars+=`<text x="${(x+bw*.32).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" class="axis-lbl" style="fill:${isLast?"var(--link)":"var(--muted)"};font-weight:500">${fmt(it.value)}</text>`;
    if(it.label&&(items.length<=6||i%2===(items.length-1)%2)) bars+=`<text x="${(x+bw*.32).toFixed(1)}" y="${h-6}" text-anchor="middle" class="axis-lbl">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" stroke="rgba(255,255,255,.08)"/>${bars}</svg>`;
}
function weekKey(ts){ // Monday of that week
  const d=new Date(ts); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return dayISO(d.getTime());
}
function trainingViewHTML(){
  const now=Date.now();
  // last 12 weeks buckets
  const weeks=[];
  for(let i=11;i>=0;i--){
    const wkStart=weekKey(now-i*7*86400000);
    weeks.push({key:wkStart,label:fmtDateShort(wkStart).split(" ").slice(0,2).join(" "),vol:0,sets:0,ses:0});
  }
  const byKey=Object.fromEntries(weeks.map(w=>[w.key,w]));
  for(const s of S.sessions){
    const k=weekKey(new Date(s.dateISO+"T12:00").getTime());
    if(byKey[k]){ byKey[k].vol+=s.volume; byKey[k].sets+=s.sets.length; byKey[k].ses++; }
  }
  const thisW=weeks[11], lastW=weeks[10];
  const dVol=lastW.vol>0?Math.round((thisW.vol-lastW.vol)/lastW.vol*100):null;
  // per-workout split (all time)
  const split=CYCLE.map(w=>({label:w,value:sum(S.sessions.filter(s=>s.workout===w).map(s=>s.volume))}));
  const totVol=sum(S.sessions.map(s=>s.volume));
  const totSets=sum(S.sessions.map(s=>s.sets.length));
  const totReps=sum(S.sessions.map(s=>sum(s.sets.map(x=>x.reps))));
  return `
    <div class="statgrid" style="margin-bottom:14px">
      <div class="stat"><div class="l">This week</div><div class="v mono" style="font-size:20px">${fmtKg(thisW.vol)}kg</div>
        ${dVol!==null?`<div style="font-size:12px;font-weight:600;color:${dVol>=0?"var(--success)":"var(--danger)"}">${dVol>=0?"+":""}${dVol}% vs last week</div>`:""}</div>
      <div class="stat"><div class="l">Sets this week</div><div class="v mono">${thisW.sets}</div>
        <div style="font-size:12px;color:var(--muted)">${thisW.ses} session${thisW.ses===1?"":"s"}</div></div>
    </div>
    <div class="chart-box"><div class="spread" style="padding:0 6px 8px"><span class="eyebrow">Weekly volume — 12 weeks</span></div>
      ${barChart(weeks.map(w=>({label:w.label,value:w.vol})))}</div>
    <div class="chart-box"><div class="spread" style="padding:0 6px 8px"><span class="eyebrow">Working sets per week</span></div>
      ${barChart(weeks.map(w=>({label:w.label,value:w.sets})),{fmt:v=>Math.round(v)})}</div>
    <div class="chart-box"><div class="spread" style="padding:0 6px 8px"><span class="eyebrow">Volume by workout — all time</span></div>
      ${barChart(split,{h:130})}</div>
    <div class="statgrid">
      <div class="stat"><div class="l">Lifetime volume</div><div class="v mono" style="font-size:19px">${fmtKg(totVol)}kg</div></div>
      <div class="stat"><div class="l">Lifetime sets</div><div class="v mono">${totSets.toLocaleString("en-GB")}</div></div>
      <div class="stat"><div class="l">Lifetime reps</div><div class="v mono">${totReps.toLocaleString("en-GB")}</div></div>
      <div class="stat"><div class="l">Sessions</div><div class="v mono">${S.sessions.length}</div></div>
    </div>`;
}

    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);

function groupIntensity(){
  // sets per muscle group in last 30 days -> intensity class
  const cut=Date.now()-30*86400000;
  const counts={};
  for(const s of S.sessions){
    if(new Date(s.dateISO+"T12:00").getTime()<cut) continue;
    for(const set of s.sets){
      for(const g of EXERCISES[set.ex].groups) counts[g]=(counts[g]||0)+1;
    }
  }
  const out={};
  for(const g in GROUPS){
    const c=counts[g]||0;
    out[g]= c===0?0 : c<8?1 : c<20?2 : 3;
  }
  return out;
}
