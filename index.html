function periodStats(fromTs,toTs){
  const ses=S.sessions.filter(s=>{const t=new Date(s.dateISO+"T12:00").getTime();return t>=fromTs&&t<toTs;});
  const sets=sum(ses.map(s=>s.sets.length));
  const prs=sum(ses.map(s=>s.prs.length));
  const xp=sum(ses.map(s=>s.xp));
  const vol=sum(ses.map(s=>s.volume));
  return {ses,n:ses.length,sets,prs,xp,vol};
}
function bestImprovement(fromTs){
  let best=null;
  for(const ex of Object.keys(EXERCISES)){
    const exp=exposuresOf(ex);
    const inP=exp.filter(e=>new Date(e.date+"T12:00").getTime()>=fromTs);
    const before=exp.filter(e=>new Date(e.date+"T12:00").getTime()<fromTs);
    if(!inP.length||!before.length) continue;
    const a=before[before.length-1], b=inP[inP.length-1];
    if(a.bestE1<=0) continue;
    const pc=(b.bestE1-a.bestE1)/a.bestE1*100;
    if(!best||pc>best.pc) best={ex,pc,from:`${fmtKg(a.topW)}kg best set`,to:`${fmtKg(b.topW)}kg`,a,b};
  }
  return best;
}
function recommendation(){
  // stalled = no e1RM or volume gain across last 3 exposures
  for(const ex of Object.keys(EXERCISES)){
    const exp=exposuresOf(ex);
    if(exp.length<4) continue;
    const last4=exp.slice(-4);
    let stalled=true;
    for(let i=1;i<last4.length;i++){
      if(last4[i].bestE1>last4[0].bestE1+0.01||last4[i].volume>last4[0].volume) {stalled=false;break;}
    }
    if(stalled) return `Your ${EXERCISES[ex].short.toLowerCase()} has stalled across three sessions. Consider reducing the load slightly and rebuilding.`;
  }
  if(S.sessions.length>=3) return "You're progressing across almost every lift. Keep loads unchanged and continue.";
  return "Log a few more sessions and your first recommendation will appear here.";
}

function toggleNotify(on){
  if(on && "Notification" in window && Notification.permission!=="granted"){
    Notification.requestPermission().then(p=>{ S.settings.notify=(p==="granted"); save(); renderProfile(); });
  } else { S.settings.notify=on; save(); }
}
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="forge-backup-"+dayISO(Date.now())+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.sessions||!d.streak) throw 0;
      S=d; save(); location.reload();
    }catch(e){ toast("Invalid backup file"); } };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("Delete ALL workout data, history and photos? This cannot be undone.")) return;
  if(!confirm("Really sure? Your entire training history will be erased.")) return;
  localStorage.removeItem(DB_KEY); location.reload();
}
/* ================================================================
   WORKOUT MODE
   ================================================================ */
function startOrResumeWorkout(){
  if(!S.activeSession){
    const wk=S.nextWorkout;
    S.activeSession={
      workout:wk, start:Date.now(), exIndex:0, setIndex:0,
      sets:[], prs:[], xp:0,
      weights:Object.fromEntries(WORKOUTS[wk].ex.map(ex=>{
        const t=targetFor(ex,wk);
        return [ex, t.weight!=null?t.weight:(EXERCISES[ex].unit==="+kg"?0:40)];
      })),
      lastReps:{},
    };
    snapshotSession(S.activeSession);
    save();
  }
  renderWorkout();
  el("workout-overlay").classList.add("open");
}
function quitWorkout(){
  if(S.activeSession.sets.length===0 || confirm("Leave workout? Progress so far is kept — you can resume any time.")){
    clearInterval(restT); restT=null;
    el("workout-overlay").classList.remove("open");
    renderAll();
  }
}
function abandonWorkout(){
  if(!confirm("Discard this workout entirely? Logged sets will be lost.")) return;
  clearInterval(restT); restT=null;
  S.activeSession=null; save();
  el("workout-overlay").classList.remove("open");
  renderAll();
}
function ssPartner(wk,ex){ const ss=wkDef(wk).superset; if(!ss||!ss.includes(ex)) return null; return ss[0]===ex?ss[1]:ss[0]; }
function repLabel(def){ return def.timed?"Seconds":("Reps"+(def.per?" / "+def.per:"")); }
function unitLabel(def){ return def.unit==="+kg"?"kg added":"kg"; }
function exHeadHTML(A,wk,ex,def,pr){
  return `<div style="margin:22px 0 4px">
      <div style="font-size:13px;color:var(--muted)">Exercise ${A.exIndex+1} of ${wk.ex.length}</div>
      <h2 style="font-size:32px;line-height:1.13;letter-spacing:.004em;margin-top:2px">${def.name}</h2>
      <div style="font-size:15px;color:var(--muted);margin-top:6px">${pr.sets} × ${pr.repLo}–${pr.repHi}${def.timed?" sec":""}${def.per?" each "+def.per:""} &nbsp;·&nbsp; ${pr.rir!=="—"?pr.rir+" RIR &nbsp;·&nbsp; ":""}rest ${fmtDur(pr.rest)}</div>
    </div>`;
}
function scoreHTML(A,ex,def,pr,doneSets,w){
  const t=targetFor(ex,A.workout), last=lastExposure(ex,A.workout);
  const repsSoFar=sum(doneSets.map(s=>s.reps));
  const uw=def.timed?"sec":"reps";
  if(t.mode==="beat"){
    const target=t.prevReps, pct=Math.min(100,repsSoFar/(target+1)*100);
    const win=repsSoFar>target, left=Math.max(0,target+1-repsSoFar);
    const setsLeft=pr.sets-doneSets.length, thr=upThreshold(ex,A.workout);
    return `<div class="score">
      <div class="vs">
        <div class="side"><div class="k">Last time</div><div class="n">${target}</div><div class="u">${uw} @ ${fmtKg(last.topW)}${def.unit}</div></div>
        <div class="vsmark">vs</div>
        <div class="side right"><div class="k">Today</div><div class="n" style="color:${win?"var(--link)":"var(--text)"}">${repsSoFar}</div><div class="u">${uw} @ ${fmtKg(w)}${def.unit}</div></div>
      </div>
      <div class="bar ${win?"win":""}"><i style="width:${pct}%"></i><em></em></div>
      ${win?`<div class="msg win">Past you: beaten. +${repsSoFar-target} — keep stacking.</div>`
          :`<div class="msg">${left} more ${left===1?uw.replace(/s$/,""):uw} to win${setsLeft?` · ${setsLeft} set${setsLeft>1?"s":""} left`:""}</div>`}
      <div class="sub">Add weight at <b style="color:var(--text)">${thr}</b> total ${uw} · last time ${target}</div>
    </div>`;
  }
  if(t.mode==="increase") return `<div class="score">
      <div class="vs">
        <div class="side"><div class="k">Cleared</div><div class="n">${fmtKg(t.prevW)}</div><div class="u">${def.unit} · ${upThreshold(ex,A.workout)}+ ${uw}</div></div>
        <div class="vsmark">→</div>
        <div class="side right"><div class="k">New weight</div><div class="n" style="color:var(--link)">${fmtKg(t.weight)}</div><div class="u">${def.unit} · aim ${pr.repLo}+ per set</div></div>
      </div>
      <div class="msg" style="margin-top:14px">Level up. Own the new weight — ${pr.repLo}–${pr.repHi}${def.timed?" sec":""} per set.</div>
    </div>`;
  return `<div class="score">
      <div class="k" style="font-size:14px;color:var(--muted)">Set the bar</div>
      <div class="msg" style="margin-top:6px">First ${pr.sets}×${pr.repLo}–${pr.repHi} session. ${t.weight?`Start around ${fmtKg(t.weight)}${def.unit}. `:""}Today's numbers become the score to beat.</div>
    </div>`;
}
function tileHTML(ex,def,w,reps,idx){
  const sfx=idx==null?"":"-"+idx;
  return `<div class="row" style="gap:10px">
      <div class="tile">
        <div class="tl">${unitLabel(def)}</div>
        <input class="tv mono" id="in-w${sfx}" type="number" inputmode="decimal" step="0.5" value="${w}" readonly onclick="editNum(this)" onblur="this.readOnly=true">
        <div class="tb"><button onpointerdown="event.preventDefault()" onclick="bumpN('in-w${sfx}',-${def.inc})">−</button><button onpointerdown="event.preventDefault()" onclick="bumpN('in-w${sfx}',${def.inc})">+</button></div>
      </div>
      <div class="tile">
        <div class="tl">${repLabel(def)}</div>
        <input class="tv mono" id="in-r${sfx}" type="number" inputmode="numeric" value="${reps}" readonly onclick="editNum(this)" onblur="this.readOnly=true">
        <div class="tb"><button onpointerdown="event.preventDefault()" onclick="bumpN('in-r${sfx}',-${def.timed?5:1})">−</button><button onpointerdown="event.preventDefault()" onclick="bumpN('in-r${sfx}',${def.timed?5:1})">+</button></div>
      </div>
    </div>`;
}
function suggestReps(A,ex,pr,doneSets){
  if(A.lastReps[ex]!=null) return A.lastReps[ex];
  const last=lastExposure(ex,A.workout);
  return last?last.sets[Math.min(doneSets.length,last.sets.length-1)].reps:pr.repHi;
}
function setChips(doneSets,ex){
  if(!doneSets.length) return "";
  const vol=sum(doneSets.map(s=>s.w*s.reps));
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px">
    ${doneSets.map((s,i)=>`<button class="chipset" onclick="openEditSet('live','${ex}',${i})">${i+1} \u00B7 ${fmtKg(s.w)}\u00D7${s.reps}</button>`).join("")}
    ${vol?`<span class="tag gold mono" style="opacity:.6">${fmtKg(vol)}kg</span>`:""}
    <button class="chipset undo" onclick="undoLastSet()">\u21A9 Undo last</button>
  </div>`;
}
function renderWorkout(){
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  let ex=wk.ex[A.exIndex];
  // a superset is always entered at its first member so both halves show together
  const ss=wk.superset;
  if(ss&&ss.includes(ex)&&ex!==ss[0]){ A.exIndex=wk.ex.indexOf(ss[0]); ex=ss[0]; }
  const isSS = !!(ss&&ss.includes(ex));

  const head=`<div class="wk-wrap"><div class="onband">
    <div class="wk-top">
      <button class="icon-btn" onclick="quitWorkout()">✕</button>
      <div style="text-align:center">
        <div style="font-size:15px;color:var(--text);letter-spacing:-.01em">Workout ${A.workout} · ${wk.title}</div>
        <div style="font-size:13px;color:var(--muted)" class="mono" id="wk-clock">${fmtDur((Date.now()-A.start)/1000)}</div>
      </div>
      <button class="icon-btn" onclick="abandonWorkout()" title="Discard">🗑</button>
    </div>`;

  if(isSS){
    const pair=ss.map(k=>({k,def:EXERCISES[k],pr:presc(k,A.workout),done:A.sets.filter(x=>x.ex===k)}));
    const setN=Math.min(Math.min(...pair.map(o=>o.done.length))+1,Math.max(...pair.map(o=>o.pr.sets)));
    const totalSets=Math.max(...pair.map(o=>o.pr.sets));
    el("workout-overlay").innerHTML=head+`
      <div style="margin:22px 0 6px">
        <div style="font-size:13px;color:var(--link)">Superset · both exercises, back to back</div>
        <h2 style="font-size:28px;line-height:1.14;letter-spacing:.007em;margin-top:2px">${pair.map(o=>o.def.short).join(" + ")}</h2>
        <div style="font-size:15px;color:var(--muted);margin-top:6px">No rest between them — rest ${fmtDur(pair[0].pr.rest)} after the pair</div>
      </div>
      </div>
      <div class="spread" style="margin:8px 2px 10px">
        <span style="font-size:15px;color:var(--muted)">Set ${setN} of ${totalSets}</span>
        <span class="setdots" style="margin:0">${Array.from({length:totalSets},(_,i)=>`<i class="${i<pair[0].done.length?"done":i===pair[0].done.length?"cur":""}" style="width:18px"></i>`).join("")}</span>
      </div>
      ${restBarHTML()}
      ${pair.map((o,i)=>`<div class="sscard">
        <div class="spread" style="margin-bottom:10px">
          <div style="min-width:0">
            <div class="ssnum">${i+1}</div>
            <span style="font-size:18px;font-weight:600;letter-spacing:.011em">${o.def.name}</span>
            <div style="font-size:13px;color:var(--muted);margin-top:2px">${o.pr.sets} × ${o.pr.repLo}–${o.pr.repHi} · ${o.pr.rir} RIR${(()=>{const t=targetFor(o.k,A.workout);return t.mode==="beat"?` · beat ${t.prevReps} total`:t.mode==="increase"?` · ⬆ ${fmtKg(t.weight)}${o.def.unit}`:"";})()}</div>
          </div>
          <span class="mono" style="font-size:13px;color:${o.done.length>=o.pr.sets?"var(--link)":"var(--dim)"};flex-shrink:0">${o.done.length}/${o.pr.sets}</span>
        </div>

      </div>`).join("")}
      <div style="flex:1"></div>
      <button class="btn primary" style="margin-top:18px" onclick="completeSuperset()">Complete both <span class="xpchip" style="background:rgba(255,255,255,.18);color:#fff">⚡ +${XP.SET*2}</span></button>
    </div>`;
    return;
  }

  const def=EXERCISES[ex], pr=presc(ex,A.workout);
  const doneSets=A.sets.filter(s=>s.ex===ex);
  const setN=Math.min(doneSets.length+1,pr.sets);
  el("workout-overlay").innerHTML=head+exHeadHTML(A,wk,ex,def,pr)+`</div>
    ${scoreHTML(A,ex,def,pr,doneSets,A.weights[ex])}
    ${wk.note&&A.exIndex===0?`<div class="card" style="padding:14px 16px;margin-bottom:10px"><div style="font-size:14px;color:var(--muted)">${wk.note}</div></div>`:""}
    <div class="spread" style="margin:4px 2px 10px">
      <span style="font-size:15px;color:var(--muted)">Set ${setN} of ${pr.sets}</span>
      <span class="setdots" style="margin:0">${Array.from({length:pr.sets},(_,i)=>`<i class="${i<doneSets.length?"done":i===doneSets.length?"cur":""}" style="width:18px"></i>`).join("")}</span>
    </div>
    ${restBarHTML()}
    ${tileHTML(ex,def,A.weights[ex],suggestReps(A,ex,pr,doneSets),null)}
    ${setChips(doneSets,ex)}
    <div style="flex:1"></div>
    <button class="btn primary" style="margin-top:20px" onclick="completeSet()">Complete set <span class="xpchip" style="background:rgba(255,255,255,.18);color:#fff">⚡ +${XP.SET}</span></button>
  </div>`;
}
function bumpN(id,d){ const i=el(id); if(!i) return; i.value=Math.max(0,Math.round((parseFloat(i.value||0)+d)*10)/10); haptic(8); }
function bumpW(d){ bumpN("in-w",d); }
function bumpR(d){ bumpN("in-r",d); }
function editNum(inp){ inp.readOnly=false; inp.focus(); try{ inp.select(); }catch(e){} }

function logSet(ex,w,reps){
  const A=S.activeSession;
  A.weights[ex]=w; A.lastReps[ex]=reps;
  A.sets.push({ex,w,reps});
  A.xp+=XP.SET;
  const prs=checkSetPRs(ex,w,reps,dayISO(Date.now()));
  for(const pp of prs){
    A.prs.push(pp); A.xp+=XP.PR;
    S.prLog.push({date:dayISO(Date.now()),ex,type:pp.type,label:pp.label});
    toast(`\U0001F3C6 NEW PR — ${pp.label} <b style="color:var(--gold)">${pp.delta}</b>`);
    sndPR(); haptic([30,60,30,60,80]);
  }
  if(!prs.length){ sndSet(); haptic(15); }
}
function markExDone(ex,sets){
  const A=S.activeSession; A.finished=A.finished||[];
  if(A.finished.includes(ex)) return;
  A.finished.push(ex);
  scoreExercise(ex,sets);
}
function nextIncompleteIdx(){
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  for(let i=0;i<wk.ex.length;i++){
    const k=wk.ex[i];
    if(A.sets.filter(x=>x.ex===k).length < presc(k,A.workout).sets) return i;
  }
  return -1;
}
function advanceAfter(idx){
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  const n=nextIncompleteIdx();
  if(n<0){ finishWorkout(); return; }
  const restFor=presc(wk.ex[idx],A.workout).rest;
  A.exIndex=n; save();
  startRest(true,restFor);
}
function completeSet(){
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  const ex=wk.ex[A.exIndex], pr=presc(ex,A.workout);
  const w=parseFloat(el("in-w").value)||0;
  const reps=parseInt(el("in-r").value)||0;
  if(reps<=0){ toast(EXERCISES[ex].timed?"Enter your hold in seconds":"Enter your reps first"); return; }
  logSet(ex,w,reps);
  const done=A.sets.filter(s=>s.ex===ex);
  if(done.length>=pr.sets){ markExDone(ex,done); save(); advanceAfter(A.exIndex); }
  else { save(); startRest(false,pr.rest); }
}
function completeSuperset(){
  const A=S.activeSession, wk=WORKOUTS[A.workout], ss=wk.superset;
  const vals=ss.map((k,i)=>({k,w:parseFloat(el("in-w-"+i).value)||0,reps:parseInt(el("in-r-"+i).value)||0}));
  if(vals.some(v=>v.reps<=0)){ toast("Enter reps for both exercises"); return; }
  vals.forEach(v=>logSet(v.k,v.w,v.reps));
  let allDone=true;
  for(const v of vals){
    const done=A.sets.filter(x=>x.ex===v.k);
    if(done.length>=presc(v.k,A.workout).sets) markExDone(v.k,done); else allDone=false;
  }
  save();
  if(allDone) advanceAfter(A.exIndex);
  else startRest(false,presc(ss[0],A.workout).rest);
}
function scoreExercise(ex,sets){
  const A=S.activeSession, def=EXERCISES[ex], pr=presc(ex,A.workout);
  A.xp+=XP.EXERCISE;
  const sesPRs=checkSessionPRs(ex,sets,dayISO(Date.now()));
  for(const pp of sesPRs){
    A.prs.push(pp); A.xp+=XP.PR;
    S.prLog.push({date:dayISO(Date.now()),ex,type:pp.type,label:pp.label});
    toast(`\U0001F3C6 ${pp.label} <b style="color:var(--gold)">${pp.delta}</b>`);
    sndPR();
  }
  const topW=Math.max(...sets.map(s=>s.w));
  const total=sum(sets.map(x=>x.reps));
  const mastered=sets.length>=pr.sets && total>=upThreshold(ex,A.workout);
  const key=A.workout+":"+topW;
  if(mastered && !S.exState[ex].mastered.includes(key)){
    S.exState[ex].mastered.push(key);
    A.xp+=XP.MASTER;
    toast(`\U0001F3CB️ ${total} total ${def.timed?"sec":"reps"} — next session go ${fmtKg(topW+def.inc)}${def.unit}`,true);
    sndPR(); haptic([40,80,40,80,120]);
  }
}

/* ---------------- editing logged sets ---------------- */
function snapshotSession(A){
  A.snap={
    prs:JSON.parse(JSON.stringify(S.prs||{})),
    prLogLen:S.prLog.length,
    mastered:Object.fromEntries(Object.keys(S.exState).map(k=>[k,[...(S.exState[k].mastered||[])]])),
  };
}
/* rebuild everything this session derived, from its raw sets */
function replaySession(){
  const A=S.activeSession; if(!A) return;
  if(!A.snap) snapshotSession(A);
  S.prs=JSON.parse(JSON.stringify(A.snap.prs));
  S.prLog.length=A.snap.prLogLen;
  for(const k in A.snap.mastered) if(S.exState[k]) S.exState[k].mastered=[...A.snap.mastered[k]];
  A.prs=[]; A.xp=0; A.finished=[];
  const d=dayISO(Date.now());
  const seen=new Set(S.sessions.flatMap(x=>x.sets.map(y=>y.ex)));
  const byEx={};
  for(const st of A.sets){
    (byEx[st.ex]=byEx[st.ex]||[]).push(st);
    A.xp+=XP.SET;
    const prs=checkSetPRs(st.ex,st.w,st.reps,d,seen.has(st.ex));
    for(const pp of prs){ A.prs.push(pp); A.xp+=XP.PR; S.prLog.push({date:d,ex:st.ex,type:pp.type,label:pp.label}); }
  }
  for(const ex of WORKOUTS[A.workout].ex){
    const sets=byEx[ex]||[]; const pr=presc(ex,A.workout);
    if(sets.length<pr.sets) continue;
    A.finished.push(ex); A.xp+=XP.EXERCISE;
    const sesPRs=checkSessionPRs(ex,sets,d,seen.has(ex));
    for(const pp of sesPRs){ A.prs.push(pp); A.xp+=XP.PR; S.prLog.push({date:d,ex,type:pp.type,label:pp.label}); }
    const topW=Math.max(...sets.map(x=>x.w));
    const key=A.workout+":"+topW;
    if(sum(sets.map(x=>x.reps))>=upThreshold(ex,A.workout) && !S.exState[ex].mastered.includes(key)){
      S.exState[ex].mastered.push(key); A.xp+=XP.MASTER;
    }
  }
  const n=nextIncompleteIdx();
  if(n>=0) A.exIndex=n;
  save();
}
function undoLastSet(){
  const A=S.activeSession; if(!A||!A.sets.length) return;
  const last=A.sets[A.sets.length-1];
  A.sets.pop();
  replaySession();
  clearInterval(restT); restT=null; A.rest=null; save();
  renderWorkout(); haptic(20);
  toast("Removed "+EXERCISES[last.ex].short+" "+fmtKg(last.w)+"×"+last.reps);
}
/* unified set editor — works on the live session and on saved ones */
function openEditSet(scope,exOrId,arg1,arg2){

      <div class="tile"><div class="tl">${repLabel(def)}</div>

function saveEditSet(scope,a,b,c){
  const w=parseFloat(el("ed-w").value)||0, reps=parseInt(el("ed-r").value)||0;
  if(reps<=0){ toast("Reps must be more than zero"); return; }
  if(scope==="live"){
    const A=S.activeSession, list=A.sets.filter(x=>x.ex===a);
    const target=list[+b]; target.w=w; target.reps=reps;
    A.weights[a]=w;
    replaySession(); closeSheet(); renderWorkout();
  } else {
    const ses=S.sessions.find(x=>String(x.id)===String(a));
    ses.sets[+c].w=w; ses.sets[+c].reps=reps;
    rebuildHistory(); closeSheet(); renderAll(); openSession(a);
  }
  haptic(15); toast("Set updated",true);
}
function deleteSet(scope,a,b,c){
  if(scope==="live"){
    const A=S.activeSession, list=A.sets.filter(x=>x.ex===a), target=list[+b];
    A.sets.splice(A.sets.indexOf(target),1);
    replaySession(); closeSheet(); renderWorkout();
  } else {
    const ses=S.sessions.find(x=>String(x.id)===String(a));
    ses.sets.splice(+c,1);
    if(!ses.sets.length){ S.sessions=S.sessions.filter(x=>x!==ses); S.workoutsDone=Math.max(0,S.workoutsDone-1); }
    rebuildHistory(); closeSheet(); renderAll();
    if(S.sessions.some(x=>String(x.id)===String(a))) openSession(a);
  }
  haptic(20); toast("Set deleted");
}
/* replay every saved session so PRs, volumes and grades stay truthful after an edit */
function rebuildHistory(){
  S.prs={}; S.prLog=[];
  const seen=new Set();
  for(const ses of S.sessions){
    const byEx={}; const prs=[];
    for(const st of ses.sets){
      (byEx[st.ex]=byEx[st.ex]||[]).push(st);
      const got=checkSetPRs(st.ex,st.w,st.reps,ses.dateISO,seen.has(st.ex));
      for(const pp of got){ prs.push(pp); S.prLog.push({date:ses.dateISO,ex:st.ex,type:pp.type,label:pp.label}); }
    }
    for(const ex in byEx){
      const got=checkSessionPRs(ex,byEx[ex],ses.dateISO,seen.has(ex));
      for(const pp of got){ prs.push(pp); S.prLog.push({date:ses.dateISO,ex,type:pp.type,label:pp.label}); }
      seen.add(ex);
    }
    ses.volume=sum(ses.sets.map(x=>x.w*x.reps));
    ses.prs=prs;
  }
  save();
}

/* ---------------- rest timer (inline, non-blocking) ---------------- */
let restT=null;
function restMs(){ const A=S.activeSession; return A&&A.rest?Math.max(0,A.rest.until-Date.now()):0; }
function startRest(betweenEx,secs){
  const A=S.activeSession; if(!A) return;
  const total=(S.settings.restSec>0?S.settings.restSec:null)||secs||120;
  A.rest={until:Date.now()+total*1000,total,next:!!betweenEx};
  save(); renderWorkout();
  clearInterval(restT); restT=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  const A=S.activeSession;
  if(!A||!A.rest){ clearInterval(restT); restT=null; return; }
  const left=restMs(), t=el("rest-time"), b=el("rest-bar");
  if(!t){ return; }
  t.textContent=fmtDur(Math.ceil(left/1000));
  if(b) b.style.width=(left/(A.rest.total*1000)*100)+"%";
  if(left<=0) endRest(true);
}
function addRest(sec){ const A=S.activeSession; if(A&&A.rest){ A.rest.until+=sec*1000; A.rest.total+=sec; save(); tickRest(); haptic(10); } }
function endRest(natural){
  clearInterval(restT); restT=null;
  const A=S.activeSession; if(A) A.rest=null;
  save();
  if(natural){ sndTimer(); haptic([60,80,60,80,60]); }
  renderWorkout();
}
function restBarHTML(){
  const A=S.activeSession; if(!A||!A.rest) return "";
  const wk=WORKOUTS[A.workout], nextEx=EXERCISES[wk.ex[A.exIndex]];
  const left=restMs(), pct=left/(A.rest.total*1000)*100;
  return `<div class="restbar">

/* ---------------- finish workout ---------------- */
function finishWorkout(){
  clearInterval(restT); restT=null;
  const A=S.activeSession;
  const now=Date.now();
  A.xp+=XP.WORKOUT;
  const volume=sum(A.sets.map(s=>s.w*s.reps));
  // cycle bonus
  let cycleDone=false;
  if(A.workout===CYCLE[CYCLE.length-1]){ S.cycles++; A.xp+=XP.CYCLE; cycleDone=true; }
  // streak bonuses
  const scoreBefore=computeScore().overall;
  bumpStreakOnComplete(now);
  const stCur=S.streak.cur;
  let streakBonus=0;
  if(stCur===10)streakBonus=100; else if(stCur===25)streakBonus=300; else if(stCur===50)streakBonus=750; else if(stCur===100)streakBonus=2000;
  A.xp+=streakBonus;
  // per-exercise XP
  for(const ex of WORKOUTS[A.workout].ex){
    const exSets=A.sets.filter(s=>s.ex===ex);
    const exPRs=A.prs.filter(p=>p.ex===ex).length;
    S.exState[ex].xp += exSets.length*XP.SET + XP.EXERCISE + exPRs*XP.PR;
    if(exSets.length) S.exState[ex].weight=Math.max(...exSets.map(s=>s.w));
  }
  const session={
    id:now, workout:A.workout, dateISO:dayISO(now), start:A.start, end:now,
    dur:Math.round((now-A.start)/1000), sets:A.sets, volume, xp:A.xp, prs:A.prs,
  };
  // multipliers: double-XP crate buff and redemption week
  let mult=1, multWhy=[];
  if(S.buffs.doubleNext){ mult*=2; multWhy.push("Double XP crate"); S.buffs.doubleNext=false; }
  if(redemptionActive()){ mult*=1.5; multWhy.push("Redemption week"); }
  if(mult!==1){ A.xp=Math.round(A.xp*mult); session.xp=A.xp; }
  S.sessions.push(session);
  S.workoutsDone++;
  const gr=gradeSession(A,session);
  session.grade=gr.grade;
  addXP(A.xp,"Workout "+A.workout,true);
  if(S.redemption&&!S.redemption.done){
    S.redemption.count=(S.redemption.count||0)+1;
    if(S.redemption.count>=S.redemption.target){ S.redemption.done=true; setTimeout(()=>toast("Redemption complete — you rebuilt it.",true),1400); }
  }
  S.nextWorkout=CYCLE[(CYCLE.indexOf(A.workout)+1)%CYCLE.length];
  const scoreAfter=computeScore().overall;
  S.scoreHistory.push({date:dayISO(now),score:scoreAfter});
  const newAch=evalAchievements();
  S.activeSession=null;
  save();
  sndDone(); haptic([50,100,50,100,50,100,150]);
  el("workout-overlay").classList.remove("open");
  window.__pendingCrate=true;
  renderPost(session,{scoreBefore,scoreAfter,streakBonus,cycleDone,newAch,grade:gr,mult,multWhy});
}

      <span class="mono" style="font-weight:600;font-size:18px">${x.scoreBefore} → <span style="color:var(--accent)">${x.scoreAfter}</span>
      <span style="font-size:13px;color:var(--accent)">+${x.scoreAfter-x.scoreBefore}</span></span></div></div>`:""}
    ${x.newAch.length?x.newAch.map(a=>`<div class="trophy" style="animation:pop .5s .3s both;border:1px solid var(--line2)">
      <div class="ic">${a.icon}</div>
      <div style="flex:1"><div class="eyebrow" style="color:var(--gold)">Achievement unlocked</div>
        <div style="font-weight:600">${a.name}</div><div style="font-size:12px;color:var(--muted)">${a.desc}</div></div>
    </div>`).join(""):""}
    <div class="card reveal" style="animation-delay:.55s">
      <div class="eyebrow acc" style="margin-bottom:10px">Next session plan</div>
      ${wkDef(s.workout).ex.map(ex=>{
        const t=targetFor(ex,s.workout), def=EXERCISES[ex];
        return `<div class="spread" style="padding:5px 0">
          <span style="font-weight:600;font-size:14px">${def.short}</span>
          ${t.mode==="increase"
            ?`<span style="font-size:13px;font-weight:600;color:var(--accent)">📈 Increase to ${fmtKg(t.weight)}${def.unit}</span>`
            :`<span style="font-size:13px;color:var(--muted)">Hold ${fmtKg(t.weight)}${def.unit} — beat ${t.prevReps} reps</span>`}
        </div>`;
      }).join("")}
    </div>
    <div class="card flat reveal" style="margin-top:4px;animation-delay:.65s">
      <div class="spread">
        <div><div class="eyebrow">Next up</div>
          <div style="font-weight:600;font-size:17px;margin-top:2px">Workout ${nw} — ${WORKOUTS[nw].title}</div>
          <div style="font-size:13px;color:var(--muted)">${WORKOUTS[nw].ex.map(e=>EXERCISES[e].short).join(" + ")}</div></div>
        <div class="wletter" style="font-size:40px">${nw}</div>
      </div>
    </div>
    <button class="btn primary reveal" style="margin-top:8px;animation-delay:.7s" onclick="el('post-overlay').classList.remove('open');switchTab('today');if(window.__pendingCrate)setTimeout(()=>openCrateSheet('${x.grade.grade}'),380)">Open reward 📦</button>
  </div>`;
  el("post-overlay").classList.add("open");
  setTimeout(settleQuests,900);
  countUp(el("post-vol"),s.volume,900,v=>fmtKg(v)+"kg");
  countUp(el("post-xp"),s.xp,900,v=>"+"+Math.round(v));
  celebrate();
}
/* volt spark burst on workout completion */
function celebrate(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const host=el("post-overlay");
  const c=document.createElement("canvas");
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:130";
  c.width=host.clientWidth*devicePixelRatio; c.height=host.clientHeight*devicePixelRatio;
  host.appendChild(c);
  const x=c.getContext("2d"); x.scale(devicePixelRatio,devicePixelRatio);
  const W=host.clientWidth, H=host.clientHeight;
  const P=[]; const COLS=["#0090f7","#ba62fc","#f2416b","#f55600"];
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, v=3+Math.random()*7;
    P.push({x:W/2,y:H*0.22,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,
      s:1.5+Math.random()*2.5,c:COLS[i%3],life:1,decay:.012+Math.random()*.014,r:Math.random()*Math.PI});
  }
  let frames=0;
  (function tick(){
    x.clearRect(0,0,W,H);
    let alive=false;
    for(const p of P){
      if(p.life<=0) continue;
      alive=true;
      p.x+=p.vx; p.y+=p.vy; p.vy+=.16; p.vx*=.985; p.life-=p.decay; p.r+=.1;
      x.save(); x.globalAlpha=Math.max(0,p.life); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=p.c; x.fillRect(-p.s,-p.s/2.5,p.s*2,p.s/1.2); x.restore();
    }
    frames++;
    if(alive&&frames<220) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ---------------- streak lost / token ---------------- */
function showTokenModal(){
  openSheet(`
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:44px">🧊</div>
      <h2 style="font-size:22px;font-weight:600;margin:10px 0 6px">Window expired</h2>
      <p style="color:var(--muted);font-size:14px;line-height:1.5">Your ${S.streak.cur}-workout streak is on the line.<br>
      Use a Recovery Token to protect it? You have ${S.streak.tokens}.</p>
      <button class="btn primary" style="margin-top:18px" onclick="closeSheet();useToken()">🧊 Use recovery token</button>
      <button class="btn ghost" style="margin-top:10px" onclick="closeSheet();breakStreak()">Accept the loss</button>
    </div>`);
}
function showStreakLost(lost){
  const avgImp=(()=>{
    let pcs=[];
    for(const ex of Object.keys(EXERCISES)){
      const exp=exposuresOf(ex).filter(e=>lost.started&&e.date>=lost.started);
      if(exp.length>=2&&exp[0].bestE1>0) pcs.push((exp[exp.length-1].bestE1-exp[0].bestE1)/exp[0].bestE1*100);
    }
    return pcs.length?Math.round(sum(pcs)/pcs.length*10)/10:null;
  })();
  openSheet(`
    <div style="text-align:center;padding:10px 0">
      <div class="eyebrow" style="color:var(--danger)">Momentum lost</div>
      <div class="big-num" style="margin:14px 0 4px">${lost.len}</div>
      <div style="color:var(--muted);font-weight:600">workout streak ended</div>
      <div class="statgrid" style="margin:20px 0;text-align:left">
        <div class="stat"><div class="l">Consecutive sessions</div><div class="v mono">${lost.len}</div></div>
        <div class="stat"><div class="l">Days of momentum</div><div class="v mono">${lost.days}</div></div>
        <div class="stat"><div class="l">PRs in that run</div><div class="v mono">${lost.prs}</div></div>
        <div class="stat"><div class="l">Avg strength gain</div><div class="v mono">${avgImp!==null?(avgImp>=0?"+":"")+avgImp+"%":"—"}</div></div>
      </div>
      <div class="card" style="text-align:left;margin-top:4px">
        <div class="eyebrow acc" style="margin-bottom:6px">Redemption week unlocked</div>
        <div style="font-size:15px;color:var(--text)">Every workout earns <b>1.5× XP</b> for 7 days. Complete <b>${S.redemption?S.redemption.target:4}</b> sessions to close it out.</div>
      </div>
      <p style="color:var(--muted);font-size:15px">That run is over.<br>Start the next one.</p>
      <button class="btn primary" style="margin-top:16px" onclick="closeSheet();startOrResumeWorkout()">Rebuild — start Workout ${S.nextWorkout}</button>
    </div>`);
}

/* ---------------- in-app reminders ---------------- */
let notified={};
setInterval(()=>{
  if(!S.settings.notify||!("Notification" in window)||Notification.permission!=="granted") return;
  const ss=streakState();
  if(ss.status!=="live") return;
  const h=ss.left/3600000;
  const fire=(key,body)=>{
    const day=dayISO(Date.now());
    if(notified[key]===day) return;
    notified[key]=day;
    try{ new Notification("FORGE",{body}); }catch(e){}
  };
  if(h<=1) fire("h1",`${S.streak.cur} workouts. Don't throw it away now.`);
  else if(h<=6) fire("h6",`6 hours. Don't break ${S.streak.cur}.`);
  else if(ss.sinceAct>=40) fire("inact2",`🚨 Second day with no activity. ${S.streak.cur}-workout streak at risk.`);
  else if(h<=18) fire("h18",`${Math.ceil(h)} hours left to protect your ${S.streak.cur}-workout streak.`);
  else if(ss.sinceAct>=26) fire("inact1",`No activity yesterday. Train or log active recovery.`);
},60000);

/* ---------------- demo seed (optional preview) ---------------- */
function seedDemo(){
  if(!confirm("Load 8 weeks of sample training data so you can preview every screen? You can reset it any time.")) return;
  S=freshState();
  const start=Date.now()-56*86400000;
  let t=start, wi=0;
  const w0={"incline-bench":70,"dips":0,"lateral-raise":10,"barbell-row":70,"lat-pulldown":60,"shrug":90,
    "light-squat":0,"adductor-iso":0,"glute-bridge":0,"calf-raise":60,"ohp":45,"curl":14,"tricep-pushdown":25,
    "db-row-1arm":30,"cable-row-high":25,"front-squat":80,"rdl":90,"cable-crunch":35};
  const prog={};
  while(t<Date.now()-36e5){
    if(Math.random()<0.06 && S.streak.cur>3){ t+=60*3600000; S.streak.cur=0; S.streak.windowEnds=null; S.streak.history.push({len:5,days:9,prs:2,ended:dayISO(t),started:dayISO(t-9*86400000)}); }
    const wk=CYCLE[wi%CYCLE.length];
    const A={workout:wk,start:t,exIndex:0,setIndex:0,sets:[],prs:[],xp:0,weights:{},lastReps:{}};
    for(const ex of WORKOUTS[wk].ex){
      const def=Object.assign({},EXERCISES[ex],presc(ex,wk));
      prog[ex]=prog[ex]||{w:w0[ex],reps:def.repLo+1};
      const p=prog[ex];
      for(let i=0;i<def.sets;i++){
        const reps=Math.max(def.repLo-1,Math.min(def.repHi,p.reps-Math.floor(i/2)+(Math.random()<.3?1:0)));
        A.sets.push({ex,w:p.w,reps});
        A.xp+=XP.SET;
        const prs=checkSetPRs(ex,p.w,reps,dayISO(t));
        for(const pr of prs){A.prs.push(pr);A.xp+=XP.PR;S.prLog.push({date:dayISO(t),ex,type:pr.type,label:pr.label});}
      }
      const sesPRs=checkSessionPRs(ex,A.sets.filter(s=>s.ex===ex),dayISO(t));
      for(const pr of sesPRs){A.prs.push(pr);A.xp+=XP.PR;S.prLog.push({date:dayISO(t),ex,type:pr.type,label:pr.label});}
      A.xp+=XP.EXERCISE;
      S.exState[ex].xp+=def.sets*XP.SET+XP.EXERCISE+A.prs.filter(x=>x.ex===ex).length*XP.PR;
      S.exState[ex].weight=p.w;
      if(Math.random()<.45){ p.reps++; if(p.reps>def.repHi){ p.reps=def.repLo+1; p.w+=def.inc; } }
    }
    A.xp+=XP.WORKOUT;
    if(wk===CYCLE[CYCLE.length-1]){S.cycles++;A.xp+=XP.CYCLE;}
    bumpStreakOnComplete(t);
    const vol=sum(A.sets.map(s=>s.w*s.reps));
    S.sessions.push({id:t,workout:wk,dateISO:dayISO(t),start:t-2100000,end:t,dur:1980+Math.floor(Math.random()*600),sets:A.sets,volume:vol,xp:A.xp,prs:A.prs});
    S.workoutsDone++; S.xp+=A.xp;
    S.scoreHistory.push({date:dayISO(t),score:computeScore().overall});
    wi++;
    t+=(40+Math.random()*14)*3600000;
  }
  S.nextWorkout=CYCLE[wi%CYCLE.length];
  S.streak.windowEnds=Date.now()+windowMs()*0.7;
  // bodyweight drift 95 -> up
  for(let d=0;d<=56;d+=4){
    S.bodyLogs.push({date:dayISO(start+d*86400000),weight:Math.round((95+d*0.035+Math.random()*.4-.2)*10)/10,
      waist:Math.round((86+d*0.005)*10)/10,chest:Math.round((109+d*0.03)*10)/10,arms:Math.round((39+d*0.015)*10)/10,thighs:Math.round((63+d*0.02)*10)/10});
  }
  evalAchievements();
  save(); location.reload();
}

/* ---------------- PWA + update banner ---------------- */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // check for a new version every time the app is opened / foregrounded
      reg.update();
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update(); });
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller) showUpdateBanner();
        });
      });
    }).catch(()=>{});
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!refreshing){ refreshing=true; location.reload(); } });
  });
}
function showUpdateBanner(){
  if(el("upd-banner")) return;
  const b=document.createElement("div");
  b.id="upd-banner";
  b.style.cssText="position:fixed;left:14px;right:14px;top:calc(10px + var(--sat));z-index:500;max-width:492px;margin:0 auto;background:rgba(66,66,69,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-radius:9999px;padding:12px 18px;font-weight:500;font-size:15px;display:flex;justify-content:space-between;align-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both;cursor:pointer";
  b.innerHTML='<span>✨ New FORGE version ready</span><span style="background:var(--brand);border-radius:9999px;padding:6px 14px">Update</span>';
  b.onclick=()=>{ navigator.serviceWorker.getRegistration().then(r=>{ if(r&&r.waiting) r.waiting.postMessage("SKIP_WAITING"); else location.reload(); }); };
  document.body.appendChild(b);
}
