<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="theme-color" content="#0A0A0C">
<title>FORGE — Strength</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  /* BePresent-style light system */
  /* dark performance system (ref: charcoal cards, black tiles, volt CTA) */
  --brand:#E6FF5C; --brand2:#F3FF9A; --brand-deep:#AFC93A;
  --bg:#0A0A0C; --bg2:#141417;
  --card:#19191E; --card2:#0C0C0E; --card3:#26262C;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.12);
  --text:#F5F5F7; --muted:#A3A3AC; --dim:#6A6A74;
  --accent:#E6FF5C; --accent-ink:#0A0A0C; --accent-dim:rgba(230,255,92,.12);
  --gold:#FFD54A; --gold-dim:rgba(255,213,74,.14); --gold-bg:#2B2410;
  --orange:#FF8A4C; --orange-bg:#2B1A12;
  --success:#35E0A1; --success-dim:rgba(53,224,161,.12); --success-line:rgba(53,224,161,.45);
  --danger:#FF5C6C; --danger-dim:rgba(255,92,108,.12); --danger-deep:#B33A46;
  --warn:#FFB347;
  --pink:#FF4D8D; --blue:#4DA3FF; --purple:#B96CFF;
  --shadow:0 8px 28px rgba(0,0,0,.35); --shadow2:0 12px 40px rgba(0,0,0,.5);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --r:26px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","SF Pro Display",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.4; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  position:fixed; inset:0; overflow:hidden; width:100%;
}
#app{max-width:520px;margin:0 auto;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;position:relative;z-index:1}
.screen{display:none;padding:calc(14px + var(--sat)) 16px calc(126px + var(--sab));animation:fadeUp .28s ease both;position:relative;min-height:100%}
.screen.active{display:block}
/* brand band curving in from the top (every screen) */
/* faint volt glow at the top instead of a colour band */
.screen::before,.overlay .wk-wrap::before{content:"";position:absolute;left:-20%;right:-20%;top:-10%;height:280px;z-index:0;pointer-events:none;
  background:radial-gradient(60% 70% at 50% 0%,rgba(230,255,92,.09),transparent 70%)}
.screen>*{position:relative;z-index:1}
.screen>.spread:first-child h1,.screen>.spread:first-child .eyebrow{color:#fff}
.screen>.spread:first-child .eyebrow{color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes pulseGlow{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
h1,h2,h3{font-family:inherit;letter-spacing:-.02em}
.icn{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;display:inline-block;flex-shrink:0}
.reveal{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes shine{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(230%) skewX(-18deg)}}
@keyframes ringPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.acc{color:var(--brand)}
.big-num{font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}

.card{background:var(--card);border:none;border-radius:var(--r);padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.card.flat{background:var(--card);box-shadow:var(--shadow)}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.spread{display:flex;justify-content:space-between;align-items:center}

/* chunky raised buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:99px;
  padding:17px 18px;font-size:17px;font-weight:800;letter-spacing:.01em;cursor:pointer;font-family:inherit;
  transition:transform .08s ease,box-shadow .08s ease;position:relative}
.btn.primary{background:var(--brand);color:var(--accent-ink);box-shadow:0 5px 0 var(--brand-deep)}
.btn.ghost{background:#232329;color:var(--text);box-shadow:0 5px 0 #0C0C0E}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 5px 0 var(--danger-deep)}
.btn:active{transform:translateY(4px)}
.btn.primary:active{box-shadow:0 1px 0 var(--brand-deep)} .btn.ghost:active{box-shadow:0 1px 0 #0C0C0E} .btn.danger:active{box-shadow:0 1px 0 var(--danger-deep)}
.btn.small{padding:11px 16px;font-size:14px;width:auto}
.btn.small.primary{box-shadow:0 3px 0 var(--brand-deep)} .btn.small.ghost{box-shadow:0 3px 0 #0C0C0E} .btn.small.danger{box-shadow:0 3px 0 var(--danger-deep)}
.btn:disabled{opacity:.4;pointer-events:none}

/* ---------- tab bar (floating white pill) ---------- */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:520px;margin:0 auto;
  background:rgba(20,20,23,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line);border-radius:26px 26px 0 0;display:flex;align-items:flex-end;justify-content:space-around;
  padding:8px 10px calc(6px + var(--sab));box-shadow:0 -10px 34px rgba(0,0,0,.45)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  color:var(--dim);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:8px 0 6px;border-radius:20px;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--brand);background:rgba(230,255,92,.08)}
.tab.train{margin-top:-30px;background:none}
.tab.train .train-btn{width:60px;height:60px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 var(--brand-deep),0 10px 26px rgba(230,255,92,.3);border:4px solid var(--bg)}
.tab.train .train-btn svg{stroke:var(--accent-ink);width:27px;height:27px;stroke-width:2.2}
.tab.train:active .train-btn{transform:translateY(3px);box-shadow:0 2px 0 var(--brand-deep)}

/* ---------- header pills / xp ---------- */
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;border:1px solid var(--line2);
  padding:8px 13px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap}
.pill.xp{background:var(--gold-bg);color:var(--gold);border-color:rgba(255,213,74,.3)}
.pill.streak{background:var(--orange-bg);color:var(--orange);border-color:rgba(255,138,76,.3)}
.xpchip{display:inline-flex;align-items:center;gap:3px;background:var(--gold-bg);color:var(--gold);border-radius:99px;
  padding:4px 9px;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle}
.xpfloat{position:fixed;z-index:400;pointer-events:none;background:var(--gold);color:#1a1200;border-radius:99px;padding:7px 13px;
  font-weight:900;font-size:15px;box-shadow:0 6px 24px rgba(245,180,0,.45);animation:xpfly 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes xpfly{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-90px) scale(.9);opacity:0}}
/* ---------- quests ---------- */
.quest{display:flex;align-items:center;gap:12px;background:var(--card2);border:1.5px solid transparent;border-radius:18px;padding:13px 14px;margin-top:10px;cursor:pointer;transition:all .3s}
.quest .chk{width:30px;height:30px;border-radius:50%;background:#26262C;display:flex;align-items:center;justify-content:center;font-size:14px;color:#4A4A52;flex-shrink:0;transition:all .3s;font-weight:900}
.quest.done{background:var(--success-dim);border-color:var(--success-line)}
.quest.done .chk{background:var(--success);color:#062B1E;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.quest.done .qt{text-decoration:line-through;color:var(--muted)}
.quest .qt{flex:1;font-weight:800;font-size:15px}
.quest .qs{font-size:12px;color:var(--dim);font-weight:600;margin-top:1px}
.qbar{height:10px;border-radius:5px;background:var(--card3);overflow:hidden;margin:12px 0 4px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
/* ---------- embers/plates canvas ---------- */
.streak-hero canvas.embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.streak-hero>*:not(canvas){position:relative;z-index:1}
/* ---------- league ---------- */
.trophies{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 8px 2px}
.trophies span{font-size:32px;filter:grayscale(1);opacity:.3;transition:all .3s}
.trophies span.on{filter:none;opacity:1;transform:scale(1.3)}
.trophies span.won{filter:none;opacity:.75}

/* ---------- today ---------- */
.streak-hero{background:linear-gradient(180deg,#202027 0%,#151519 100%);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 22px 20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow2)}
.streak-hero.danger{background:linear-gradient(180deg,#2C1618 0%,#171214 100%);border-color:rgba(255,92,108,.25)}
.flame{display:inline-block;animation:pulseGlow 2.4s ease-in-out infinite}
.countdown{font-size:46px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:center;line-height:1;margin:14px 0 10px}
.countdown-bar{height:12px;border-radius:6px;background:var(--card3);overflow:hidden;position:relative}
.countdown-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand-deep),var(--brand));transition:width 1s linear}
.countdown-bar.warn i{background:linear-gradient(90deg,var(--warn),#FBBF24)} .countdown-bar.danger i{background:linear-gradient(90deg,var(--danger),#FF6B6B)}
.cd-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:99px;padding:6px 10px 6px 6px}
.cd-row .countdown-bar{flex:1}

.nextup{border:none;border-radius:var(--r);padding:20px;margin-bottom:14px;background:var(--card);box-shadow:var(--shadow)}
.nextup .wletter{font-size:64px;font-weight:900;letter-spacing:-.04em;line-height:.9;color:var(--brand)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:none;border-radius:20px;padding:15px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.xpbar{height:8px;border-radius:4px;background:var(--card3);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.screen>.spread:first-child .xpbar{background:var(--card3)} .screen>.spread:first-child .xpbar i{background:var(--brand)}

/* ---------- heatmap ---------- */
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.hm-cell{width:100%;aspect-ratio:1;border-radius:4px;background:#1E1E23}
.hm-cell.l1{background:rgba(230,255,92,.28)} .hm-cell.l2{background:rgba(230,255,92,.5)}
.hm-cell.l3{background:rgba(230,255,92,.75)} .hm-cell.l4{background:var(--brand)}
.hm-cell.rec{background:rgba(77,163,255,.55)}
.hm-cell.miss{background:rgba(255,92,108,.45)}
.hm-cell.today{outline:2px solid var(--text)}

/* ---------- segmented ---------- */
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:2px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:56px;border:none;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:800;
  padding:9px 10px;border-radius:12px;cursor:pointer}
.seg button.active{background:var(--card3);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--line2);background:var(--card);color:var(--muted);border-radius:99px;
  padding:9px 15px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--brand);border-color:var(--brand);color:var(--accent-ink)}

/* ---------- workout mode ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none;max-width:520px;margin:0 auto}
.overlay.open{display:block;animation:fadeUp .25s ease both}
.wk-wrap{padding:calc(14px + var(--sat)) 18px calc(30px + var(--sab));min-height:100vh;display:flex;flex-direction:column;position:relative}
.wk-wrap>*{position:relative;z-index:1}
.wk-wrap .onband .eyebrow.acc{color:var(--brand)}
.wk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-family:inherit}
.setdots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.setdots i{width:28px;height:6px;border-radius:3px;background:var(--card3)}
.setdots i.done{background:var(--brand)} .setdots i.cur{background:var(--text)}
.input-stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:none;
  border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.input-stepper .stp{width:54px;height:54px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  font-size:26px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #000}
.input-stepper .stp:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.input-stepper .val{flex:1;text-align:center;background:none;border:none;color:var(--text);font-family:inherit;
  font-size:36px;font-weight:900;letter-spacing:-.02em;width:100px;font-variant-numeric:tabular-nums;outline:none}
.prev-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:7px 13px;font-size:13px;color:var(--muted);font-weight:700}
.target-banner{background:var(--card);border:1px solid rgba(230,255,92,.2);border-radius:22px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}

/* rest timer */
#rest-overlay{position:fixed;inset:0;z-index:120;background:rgba(10,10,12,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;max-width:520px;margin:0 auto}
#rest-overlay.open{display:flex;animation:fadeUp .2s ease both}
.ring-wrap{position:relative;width:240px;height:240px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

/* PR toast */
#toast-zone{position:fixed;top:calc(12px + var(--sat));left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--card);border:2px solid var(--gold);color:var(--text);border-radius:99px;padding:12px 20px;
  font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both;
  box-shadow:0 10px 34px rgba(20,30,80,.18);position:relative;overflow:hidden}
.toast::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 1.1s ease .25s 2}
.toast.acc{border-color:var(--brand)}

/* ---------- awards ---------- */
.trophy{display:flex;gap:14px;align-items:center;background:var(--card);border:none;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.trophy .ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  background:var(--gold-bg);border:none}
.trophy.locked{opacity:.6}
.trophy.locked .ic{background:var(--card2);filter:grayscale(1)}
.lvlbar{height:9px;border-radius:5px;background:var(--card3);overflow:hidden;margin-top:6px}
.lvlbar i{display:block;height:100%;background:var(--brand);border-radius:5px}

/* ---------- lists / sheets ---------- */
.list-item{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
#sheet-veil{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none}
#sheet-veil.open{display:block;animation:fadeUp .2s both}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:210;max-width:520px;margin:0 auto;background:var(--bg2);
  border:1px solid var(--line2);border-bottom:none;border-radius:30px 30px 0 0;max-height:88vh;overflow-y:auto;display:none;
  padding:10px 20px calc(30px + var(--sab));box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#sheet.open{display:block;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--card3);margin:6px auto 16px}
#sheet .card{background:var(--card);box-shadow:none}
#sheet .stat{background:var(--card);box-shadow:none}
#sheet .chart-box{background:var(--card);box-shadow:none}

/* ---------- charts ---------- */
.chart-box{background:var(--card);border:none;border-radius:var(--r);padding:18px 12px 8px;margin-bottom:14px;box-shadow:var(--shadow)}
.chart-box svg{width:100%;height:auto;display:block}
.axis-lbl{font-size:9px;fill:var(--dim);font-family:inherit;font-weight:700}

/* ---------- muscle map ---------- */
.muscle-svg path.m{fill:#2A2A31;stroke:var(--card);stroke-width:1;cursor:pointer;transition:fill .3s}
.muscle-svg path.body{fill:#1F1F25;stroke:var(--line2);stroke-width:1}
.muscle-svg path.m.i1{fill:rgba(230,255,92,.3)} .muscle-svg path.m.i2{fill:rgba(230,255,92,.6)} .muscle-svg path.m.i3{fill:var(--brand)}

/* misc */
.divider{height:1px;background:var(--line);margin:16px 0}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:5px 10px;white-space:nowrap}
.tag.acc{background:var(--accent-dim);color:var(--brand)}
.tag.gold{background:var(--gold-bg);color:var(--gold)}
.tag.red{background:var(--danger-dim);color:var(--danger)}
input[type=number],input[type=date],select{background:var(--card2);border:1px solid var(--line);color-scheme:dark;border-radius:16px;color:var(--text);
  font-family:inherit;font-size:16px;font-weight:600;padding:13px 16px;width:100%;outline:none;-webkit-appearance:none}
label.fld{display:block;margin-bottom:12px}
label.fld span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;letter-spacing:.02em}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.count-anim{transition:none}
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--card3);border-radius:99px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(20px);background:var(--accent-ink)}

<script>
"use strict";
/* ================================================================
   FORGE — personal gamified strength app. All data lives in
   localStorage and every number on screen derives from logged sets.
   ================================================================ */

const EXERCISES = {
  // identity only — sets/reps/rest live on the workout prescription (same lift can appear in two workouts)
  "incline-bench":{name:"Low-Incline Barbell Bench Press",short:"Low-Incline Bench",inc:2.5,groups:["chest","shoulders","arms"],unit:"kg"},
  "barbell-row":{name:"Barbell Row",short:"Barbell Row",inc:2.5,groups:["upperback","lats"],unit:"kg"},
  "lateral-raise":{name:"DB Lateral Raise",short:"Lateral Raise",inc:1,groups:["shoulders"],unit:"kg"},
  "curl":{name:"DB / Barbell Curl",short:"Curl",inc:1,groups:["arms"],unit:"kg"},
  "front-squat":{name:"Front Squat",short:"Front Squat",inc:2.5,groups:["quads","core"],unit:"kg"},
  "rdl":{name:"Romanian Deadlift",short:"RDL",inc:2.5,groups:["hamstrings","glutes"],unit:"kg"},
  "calf-raise":{name:"Standing Calf Raise",short:"Calf Raise",inc:2.5,groups:["calves"],unit:"kg"},
  "cable-crunch":{name:"Cable Crunch",short:"Cable Crunch",inc:2.5,groups:["core"],unit:"kg"},
  "lat-pulldown":{name:"Cable Lat Pulldown",short:"Lat Pulldown",inc:2.5,groups:["lats","upperback"],unit:"kg"},
  "ohp":{name:"Standing Barbell Overhead Press",short:"OHP",inc:2.5,groups:["shoulders","traps"],unit:"kg"},
  "bss":{name:"Bulgarian Split Squat",short:"Bulgarian Split Squat",inc:2.5,groups:["quads","glutes"],unit:"kg",perLeg:true},
  // legacy (earlier programme) — kept so old sessions still render
  "shrug":{name:"Barbell Shrugs",short:"Shrugs",inc:2.5,groups:["traps","upperback"],unit:"kg",legacy:true},
  "dips":{name:"Dips",short:"Dips",inc:2.5,groups:["chest","arms"],unit:"+kg",legacy:true},
  "cable-row-high":{name:"High Cable Row / Face Pull",short:"High Cable Row",inc:2.5,groups:["upperback","shoulders"],unit:"kg",legacy:true},
};
const ACTIVE_EX = Object.keys(EXERCISES).filter(k=>!EXERCISES[k].legacy);
// prescription: sets, rep range, rest seconds, RIR
const P=(sets,repLo,repHi,rest,rir)=>({sets,repLo,repHi,rest,rir});
const WORKOUTS = {
  A:{title:"Upper Strength",ex:["incline-bench","barbell-row","lateral-raise","curl"],superset:["lateral-raise","curl"],
     p:{"incline-bench":P(5,4,6,180,"1–2"),"barbell-row":P(5,5,8,150,"1–2"),"lateral-raise":P(3,12,20,75,"0–2"),"curl":P(3,8,15,75,"0–2")}},
  B:{title:"Lower Strength",ex:["front-squat","rdl","calf-raise","cable-crunch"],superset:["calf-raise","cable-crunch"],
     p:{"front-squat":P(5,4,6,180,"1–2"),"rdl":P(5,5,8,150,"1–2"),"calf-raise":P(3,10,20,75,"0–2"),"cable-crunch":P(3,10,20,75,"0–2")}},
  C:{title:"Upper Volume",ex:["incline-bench","lat-pulldown","ohp","lateral-raise"],
     p:{"incline-bench":P(4,7,10,150,"1–2"),"lat-pulldown":P(4,8,12,150,"1–2"),"ohp":P(3,6,10,150,"1–2"),"lateral-raise":P(3,12,20,75,"0–2")}},
  D:{title:"Lower Volume",ex:["front-squat","rdl","bss","calf-raise"],
     p:{"front-squat":P(4,7,10,150,"1–2"),"rdl":P(3,8,12,150,"1–2"),"bss":P(3,8,12,120,"1–2"),"calf-raise":P(3,10,20,75,"0–2")}},
};
const CYCLE = ["A","B","C","D"];
// legacy workout letters (earlier programme) so old sessions still render
const LEGACY_WORKOUTS={E:{title:"Legs + Core (legacy)",ex:["bss","cable-crunch"],p:{}}};
function wkDef(w){ return WORKOUTS[w]||LEGACY_WORKOUTS[w]||{title:"Workout "+w,ex:[],p:{}}; }
function presc(ex,wk){
  if(wk&&WORKOUTS[wk]&&WORKOUTS[wk].p[ex]) return WORKOUTS[wk].p[ex];
  for(const w of CYCLE) if(WORKOUTS[w].p[ex]) return WORKOUTS[w].p[ex];
  return P(3,8,12,120,"1–2"); // legacy fallback
}
function primaryWorkoutOf(ex){ for(const w of CYCLE) if(WORKOUTS[w].p[ex]) return w; return null; }
const GROUPS = {
  chest:"Chest", upperback:"Upper Back", lats:"Lats", shoulders:"Shoulders", traps:"Traps",
  arms:"Arms", core:"Core", quads:"Quads", hamstrings:"Hamstrings", glutes:"Glutes", calves:"Calves",
};
const SCORE_GROUPS = {
  "Chest":["incline-bench"],
  "Upper Back":["barbell-row","lat-pulldown"],
  "Shoulders":["ohp","lateral-raise"],
  "Arms":["curl"],
  "Lower Body":["front-squat","bss","calf-raise"],
  "Posterior Chain":["rdl"],
  "Core":["cable-crunch"],
};
const EX_LEVELS = ["Recruit","Novice","Trained","Strong","Powerful","Elite"];
const EX_LEVEL_XP = [0,150,400,800,1400,2200]; // cumulative XP to reach level i+1
const XP = {SET:10, EXERCISE:25, WORKOUT:100, PR:50, CYCLE:250, MASTER:40, RECOVERY:30, PERFECT:50};

/* ---------------- state ---------------- */
const DB_KEY = "forge.v1";
let S = null;

function freshState(){
  return {
    profile:{name:"Joe",age:30,heightCm:193,startWeightKg:95},
    settings:{windowHours:48,restSec:0,sound:true,haptics:true,notify:false},
    nextWorkout:"A",
    xp:0,
    exState:Object.fromEntries(Object.keys(EXERCISES).map(k=>[k,{weight:null,xp:0,mastered:[]}])),
    sessions:[],        // {id,workout,dateISO,start,end,dur,sets:[{ex,w,reps}],volume,xp,prs:[{ex,type,label}]}
    prs:{},             // ex -> {heaviest:{w,reps,date}, e1rm:{v,w,reps,date}, repsAt:{"80":{reps,date}}, sesVol:{v,date}, best5:{v,date}}
    prLog:[],           // {date,ex,type,label}
    streak:{cur:0,longest:0,lastEnd:null,windowEnds:null,tokens:0,tokenProgress:0,history:[],startedAt:null,protectedDates:[]},
    recovery:[],        // active rest days: {date,ts,type,value}
    xpLog:[],           // [{ts,amount,reason}] — backfilled from sessions on first load
    quests:{date:null,done:{},perfect:false},  // per-day quest completion
    league:{tier:0,weekKey:null,best:0,history:[]},
    bodyLogs:[],        // {date,weight,waist,chest,arms,thighs}
    photos:[],          // {id,date,type,dataUrl}
    achievements:{},    // id -> ts
    cycles:0,
    workoutsDone:0,
    scoreHistory:[],    // {date,score}
    activeSession:null, // in-progress workout (survives refresh)
  };
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }catch(e){ console.warn("save failed",e);} }
function load(){
  try{ const raw = localStorage.getItem(DB_KEY); S = raw ? JSON.parse(raw) : freshState(); }
  catch(e){ S = freshState(); }
  // forward-compat: fill any missing keys
  const f = freshState();
  for(const k in f) if(S[k]===undefined) S[k]=f[k];
  for(const k in f.exState) if(!S.exState[k]) S.exState[k]=f.exState[k];
  if(!S.xpLog||(S.xpLog.length===0&&S.sessions.length)){ S.xpLog=S.sessions.map(x=>({ts:x.end||x.id,amount:x.xp,reason:"Workout "+x.workout})); }
  if(!CYCLE.includes(S.nextWorkout)) S.nextWorkout="A";
  if(S.activeSession && (!WORKOUTS[S.activeSession.workout] || S.activeSession.sets.some(x=>!WORKOUTS[S.activeSession.workout].ex.includes(x.ex)))) S.activeSession=null;
  if(!S.quests) S.quests={date:null,done:{},perfect:false};
  if(!S.league) S.league={tier:0,weekKey:null,best:0,history:[]};
}

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const el = (id) => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtKg = v => (Math.round(v*10)/10).toLocaleString("en-GB");
const dayISO = ts => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => new Date(iso+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtDateShort = iso => new Date(iso+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtDur = s => { const m=Math.floor(s/60), sec=Math.floor(s%60); return m+":"+String(sec).padStart(2,"0"); };
const fmtTimer = ms => { if(ms<=0) return "00:00:00"; const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), sec=Math.floor(ms%60000/1000);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); };
const fmtClock = ms => {
  if(ms<=0) return "0h 0m";
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  return h+"h "+String(m).padStart(2,"0")+"m";
};
const e1rm = (w,r) => r>0 ? w*(1+r/30) : 0;
const sum = a => a.reduce((x,y)=>x+y,0);
function haptic(pattern){ if(S.settings.haptics && navigator.vibrate) navigator.vibrate(pattern||18); }
let AC=null;
function beep(freq=880,dur=.12,when=0,type="sine",gain=.12){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime+when;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sndSet   = ()=>{ beep(720,.09); };
const sndPR    = ()=>{ beep(660,.1); beep(880,.1,.1); beep(1108,.22,.2); };
const sndDone  = ()=>{ beep(523,.12); beep(659,.12,.12); beep(784,.12,.24); beep(1046,.3,.36); };
const sndTimer = ()=>{ beep(980,.15); beep(980,.15,.25); beep(980,.3,.5); };

function toast(msg,acc){
  const z = el("toast-zone");
  const t = document.createElement("div");
  t.className="toast"+(acc?" acc":"");
  t.innerHTML=msg;
  z.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s,transform .4s"; t.style.opacity="0"; t.style.transform="translateY(-10px)"; },2600);
  setTimeout(()=>t.remove(),3100);
}
function countUp(node,to,dur=800,fmt){
  const start=performance.now();
  function tick(now){
    const p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3);
    const v=to*e;
    node.textContent = fmt?fmt(v):Math.round(v).toLocaleString("en-GB");
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------------- icon set (Ladder-style monochrome line icons) ---------------- */
const ICONS={
  flame:'<path d="M12 2.5c2.6 3.2 5.5 6.1 5.5 9.9a5.5 5.5 0 0 1-11 0c0-2.3 1.2-4.1 2.3-5.7.4 1.4 1.2 2.3 2.4 2.6-.4-2.2-.2-4.6.8-6.8z"/>',
  bolt:'<path d="M13 2 5.5 13.5h5L9.5 22l8-11.5h-5L13 2z"/>',
  trophy:'<path d="M8 3.5h8V9a4 4 0 0 1-8 0V3.5z"/><path d="M8 5H4.5a3.5 3.5 0 0 0 3.6 3.5M16 5h3.5a3.5 3.5 0 0 1-3.6 3.5"/><path d="M12 13v3.5M8.5 20.5h7M10 20.5c.3-2 .8-4 2-4s1.7 2 2 4"/>',
  medal:'<circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5 7 21.5l5-2.5 5 2.5-1.5-8"/>',
  crown:'<path d="M4 9l4 3.5L12 5.5l4 7L20 9v8.5H4V9z"/>',
  shield:'<path d="M12 2.5 19 5.5v6c0 4.5-3 7.5-7 9.5-4-2-7-5-7-9.5v-6l7-3z"/>',
  barbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>',
  chart:'<path d="M4 4v16h16"/><path d="M7.5 15l4-4.5 3 3 5-6.5"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  swords:'<path d="M5 4l10.5 10.5M19 4 8.5 14.5"/><path d="M14 16l3.5 3.5M10 16l-3.5 3.5M16.5 13.5 20 17M7.5 13.5 4 17"/>',
  mountain:'<path d="M3 19.5 10 7l4.5 8 2.5-4 4 8.5H3z"/>',
  tree:'<path d="M12 3l5.5 7.5h-3l4 6H5.5l4-6h-3L12 3z"/><path d="M12 16.5V21"/>',
  stack:'<path d="M6 8.5h12M4.5 12h15M3.5 15.5h17"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.5 2.5M9.5 2.5h5"/>',
  lock:'<rect x="5.5" y="11" width="13" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
  trash:'<path d="M4.5 6.5h15M9.5 6.5V4.5h5v2M6.5 6.5l1 13.5h9l1-13.5M10 10v6.5M14 10v6.5"/>',
  star:'<path d="M12 3l2.7 5.6 6 .8-4.4 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.3 9.4l6-.8L12 3z"/>',
};
function ic(n,s=16,extra=""){return `<svg class="icn" style="width:${s}px;height:${s}px;${extra}" viewBox="0 0 24 24">${ICONS[n]||ICONS.star}</svg>`;}

/* ---------------- level maths ---------------- */
function levelInfo(xp){
  // level n requires 500*n XP to clear (n=1..): thresholds 500,1500,3000,5000...
  let lvl=1, need=500, base=0;
  while(xp >= base+need){ base+=need; lvl++; need=500*lvl; }
  return {lvl, into:xp-base, need, pct:Math.min(100,Math.round((xp-base)/need*100))};
}
function exLevelInfo(xp){
  let li=0;
  for(let i=EX_LEVEL_XP.length-1;i>=0;i--){ if(xp>=EX_LEVEL_XP[i]){ li=i; break; } }
  const curBase=EX_LEVEL_XP[li], next=EX_LEVEL_XP[li+1];
  const maxed = next===undefined;
  return {lvl:li+1, name:EX_LEVELS[li], maxed,
    pct: maxed?100:Math.round((xp-curBase)/(next-curBase)*100),
    toNext: maxed?0:next-xp};
}

/* ---------------- PR engine ---------------- */
function checkSetPRs(ex,w,reps,dateISO,silent){
  // returns list of PR objects triggered by one set
  if(reps<=0) return [];
  const p = S.prs[ex] = S.prs[ex] || {heaviest:null,e1rm:null,repsAt:{},sesVol:null,best5:null};
  const out=[];
  const hadHistory = exposuresOf(ex).length>0;
  if(w>0 && (!p.heaviest || w>p.heaviest.w)){
    const prev=p.heaviest; p.heaviest={w,reps,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"weight",label:`${fmtKg(w)}kg — heaviest ever`,delta:`+${fmtKg(w-prev.w)}kg`});
  }
  const est=e1rm(w,reps);
  if(w>0 && (!p.e1rm || est>p.e1rm.v+0.01)){
    const prev=p.e1rm; p.e1rm={v:est,w,reps,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"e1rm",label:`Est. 1RM ${fmtKg(est)}kg`,delta:`+${fmtKg(est-prev.v)}kg`});
  }
  const key=String(w);
  const ra=p.repsAt[key];
  if(!ra || reps>ra.reps){
    if(ra&&hadHistory) out.push({ex,type:"reps",label:`${fmtKg(w)}kg × ${reps}`,delta:`+${reps-ra.reps} rep${reps-ra.reps>1?"s":""}`});
    p.repsAt[key]={reps,date:dateISO};
  }
  return out;
}
function checkSessionPRs(ex,sets,dateISO){
  const p = S.prs[ex]; if(!p) return [];
  const out=[];
  const vol = sum(sets.map(s=>s.w*s.reps));
  const hadHistory = exposuresOf(ex).length>0;
  if(vol>0 && (!p.sesVol || vol>p.sesVol.v)){
    const prev=p.sesVol; p.sesVol={v:vol,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"volume",label:`${fmtKg(vol)}kg session volume`,delta:`+${fmtKg(vol-prev.v)}kg`});
  }
  const top5 = sets.map(s=>s.w*s.reps).sort((a,b)=>b-a).slice(0,5);
  const b5 = sum(top5);
  if(b5>0 && (!p.best5 || b5>p.best5.v)){
    const prev=p.best5; p.best5={v:b5,date:dateISO};
    if(prev&&hadHistory) out.push({ex,type:"best5",label:`Best 5-set performance`,delta:`+${fmtKg(b5-prev.v)}kg`});
  }
  return out;
}

/* ---------------- history helpers ---------------- */
function exposuresOf(ex,wk){
  // chronological list of {date,sets:[{w,reps}],volume,totalReps,topW}; wk filters to one workout letter
  const out=[];
  for(const s of S.sessions){
    if(wk&&s.workout!==wk) continue;
    const sets = s.sets.filter(x=>x.ex===ex);
    if(!sets.length) continue;
    out.push({date:s.dateISO, workout:s.workout, sets, volume:sum(sets.map(x=>x.w*x.reps)),
      totalReps:sum(sets.map(x=>x.reps)), topW:Math.max(...sets.map(x=>x.w)),
      bestE1:Math.max(...sets.map(x=>e1rm(x.w,x.reps)))});
  }
  return out;
}
function lastExposure(ex,wk){ let e=exposuresOf(ex,wk); if(!e.length&&wk) e=exposuresOf(ex); return e.length?e[e.length-1]:null; }
function targetFor(ex,wk){
  const def=EXERCISES[ex], st=S.exState[ex], pr=presc(ex,wk);
  const sameScheme=exposuresOf(ex,wk); // only compare against sessions of this workout (same rep scheme)
  const last=sameScheme.length?sameScheme[sameScheme.length-1]:null;
  const anyLast=lastExposure(ex);
  if(!last){
    // seen in another workout: carry the weight across as a starting point
    return {mode:"first", weight:anyLast?anyLast.topW:st.weight, text:anyLast?`First ${pr.sets}×${pr.repLo}–${pr.repHi} session — start around ${fmtKg(anyLast.topW)}${def.unit}`:"First session — establish your working weight.", detail:`Target ${pr.sets} × ${pr.repLo}–${pr.repHi} · ${pr.rir} RIR`};
  }
  const topReps = last.sets.length>=pr.sets && last.sets.every(x=>x.reps>=pr.repHi && x.w>=last.topW);
  if(topReps){
    const next=last.topW+def.inc;
    return {mode:"increase", weight:next, prevW:last.topW,
      text:`${fmtKg(last.topW)}${def.unit} mastered — move up`, detail:`New target: ${fmtKg(next)}${def.unit} × ${pr.sets}×${pr.repLo}–${pr.repHi}`};
  }
  return {mode:"beat", weight:last.topW, prevReps:last.totalReps,
    text:`Beat ${last.totalReps} total reps`, detail:`Last time: ${fmtKg(last.topW)}${def.unit} — ${last.sets.map(x=>x.reps).join(" / ")}`};
}

/* ---------------- streak engine ---------------- */
function windowMs(){ return S.settings.windowHours*3600000; }
function lastActivityTs(){
  const st=S.streak;
  const recTs=S.recovery.length?Math.max(...S.recovery.map(r=>r.ts)):0;
  return Math.max(st.lastEnd||0, recTs);
}
function recoveryDaysSinceWorkout(){

  const cut=S.streak.lastEnd||0;

function streakState(){
  const st=S.streak;
  if(!st.cur || !st.windowEnds) return {status:"none"};
  const left = st.windowEnds - Date.now();
  if(left<=0) return {status:"expired"};
  const h=left/3600000;
  const sinceAct=(Date.now()-lastActivityTs())/3600000;
  let tier="strong", msg="Momentum strong.";
  if(h<=1){ tier="critical"; msg=`${st.cur} workouts. Don't throw it away now.`; }
  else if(h<=6){ tier="danger"; msg=`Don't lose your ${st.cur}-workout streak.`; }
  else if(sinceAct>=40){ tier="danger"; msg=`🚨 Second day with no activity. Train or move — now.`; }
  else if(h<=12){ tier="due"; msg="Your next session is due."; }
  else if(sinceAct>=24){ tier="due"; msg="No activity logged yesterday. Train or log active recovery."; }
  else if(h<=24){ tier="soon"; msg="Momentum holding. Train today."; }
  return {status:"live",left,tier,msg,sinceAct,pct:Math.max(0,Math.min(100,left/windowMs()*100))};
}
function handleExpiry(){
  const st=S.streak;

function breakStreak(){

  const prsIn = S.prLog.filter(p=>st.startedAt && new Date(p.date+"T12:00").getTime()>=st.startedAt-86400000).length;

  st.history.push(lost);

}

/* ---------------- strength score ---------------- */
function computeScore(){
  // Per group: progression of best e1RM vs personal baseline (first 2 exposures avg),
  // plus small recency/consistency factor. Gamified, self-relative.
  const breakdown={}; let totalW=0, totalV=0;
  for(const [g,exs] of Object.entries(SCORE_GROUPS)){
    let ratios=[], trained=0;
    for(const ex of exs){
      const exp=exposuresOf(ex);
      if(!exp.length) continue;
      trained++;
      const baseArr=exp.slice(0,Math.min(2,exp.length));
      const base=sum(baseArr.map(e=>e.bestE1))/baseArr.length || 1;
      const curArr=exp.slice(-2);
      const cur=sum(curArr.map(e=>e.bestE1))/curArr.length;
      ratios.push(base>0?cur/base:1);
    }
    if(!ratios.length){ breakdown[g]=0; continue; }
    const r=sum(ratios)/ratios.length;
    const freq=Math.min(1, exs.reduce((n,ex)=>n+exposuresOf(ex).length,0)/ (exs.length*4));
    const sc=Math.round(Math.min(99, 50*r + 20*freq + (r-1)*120 ));
    breakdown[g]=Math.max(1,sc);
    totalW+=1; totalV+=breakdown[g];
  }
  const overall = totalW? Math.round(totalV/totalW*10) : 0;
  return {overall,breakdown};
}
function scoreOnDate(iso){
  const h=S.scoreHistory.filter(x=>x.date<=iso);
  return h.length?h[h.length-1].score:null;
}

function todaySession(){ const d=dayISO(Date.now()); return S.sessions.filter(x=>x.dateISO===d).pop()||null; }
function dailyQuests(){

    // 3. every set in range

  } else {

const LEAGUES=[{n:"Bronze",e:"🥉",need:0},{n:"Silver",e:"🥈",need:400},{n:"Gold",e:"🥇",need:750},{n:"Platinum",e:"🏆",need:1100},{n:"Diamond",e:"💎",need:1500}];
function settleLeague(){
  const wk=weekKey(Date.now());
  const L=S.league;
  if(L.weekKey&&L.weekKey!==wk){
    // week rolled: promote/relegate based on last week's XP
    const c0=new Date(L.weekKey+"T00:00").getTime(), c1=new Date(wk+"T00:00").getTime();
    const lastXP=sum(S.xpLog.filter(x=>x.ts>=c0&&x.ts<c1).map(x=>x.amount));
    let reached=0; LEAGUES.forEach((l,i)=>{ if(lastXP>=l.need) reached=i; });
    const prev=L.tier;
    if(reached>L.tier) L.tier=Math.min(LEAGUES.length-1,L.tier+1);
    else if(reached<L.tier) L.tier=Math.max(0,L.tier-1);
    L.history.push({week:L.weekKey,xp:lastXP,from:prev,to:L.tier});
    L.best=Math.max(L.best||0,lastXP);
    if(L.tier>prev) setTimeout(()=>toast(`${LEAGUES[L.tier].e} PROMOTED to ${LEAGUES[L.tier].n} League`,true),600);
  }
  L.weekKey=wk; save();
}

/* ---------------- ambient embers (streak hero) ---------------- */
let emberRAF=null;
function startEmbers(){
  // floating weight plates — the light-theme "clouds", but training-shaped
  stopEmbers();
  const host=document.querySelector(".streak-hero"); if(!host) return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas"); c.className="embers"; host.prepend(c);
  const dpr=Math.min(2,devicePixelRatio||1);
  const W=host.clientWidth, H=host.clientHeight; c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const danger=host.classList.contains("danger");
  const n=Math.min(16,5+Math.floor(S.streak.cur/3));
  const P=Array.from({length:n},()=>spawn(true));
  function spawn(init){ const r=10+Math.random()*22; return {x:Math.random()*W,y:init?Math.random()*H:H+r*2,r,
    vx:(Math.random()-.5)*.12,vy:-(.08+Math.random()*.16),a:.10+Math.random()*.16,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.004}; }
  let t=0;
  (function tick(){
    t+=.016; x.clearRect(0,0,W,H);
    for(const p of P){
      p.x+=p.vx+Math.sin(t*.7+p.r)*.08; p.y+=p.vy; p.rot+=p.vr;
      if(p.y<-p.r*2){ Object.assign(p,spawn(false)); }
      const fade=Math.min(1,p.y/(H*.3));
      const col=danger?"255,92,108":"230,255,92";
      x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.globalAlpha=p.a*fade*.9;
      // plate: filled disc, rim, hub
      x.fillStyle=`rgb(${col})`; x.beginPath(); x.arc(0,0,p.r,0,Math.PI*2); x.fill();
      x.globalAlpha=p.a*fade*1.8; x.strokeStyle="rgba(10,10,12,.9)"; x.lineWidth=Math.max(1.2,p.r*.09);
      x.beginPath(); x.arc(0,0,p.r*.7,0,Math.PI*2); x.stroke();
      x.fillStyle="rgba(10,10,12,.9)"; x.beginPath(); x.arc(0,0,p.r*.16,0,Math.PI*2); x.fill();
      x.restore();
    }
    emberRAF=requestAnimationFrame(tick);
  })();
}
function stopEmbers(){ if(emberRAF) cancelAnimationFrame(emberRAF); emberRAF=null; document.querySelectorAll("canvas.embers").forEach(c=>c.remove()); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopEmbers(); else if(activeTab==="today") startEmbers(); });

function nearestAchievements(n){
  const out=[];
  for(const a of ACHIEVEMENTS){
    if(S.achievements[a.id]) continue;
    let prog=null;
    if(a.id==="momentum") prog=[S.streak.cur,5];
    else if(a.id==="double-digits") prog=[S.streak.cur,10];
    else if(a.id==="locked-in") prog=[S.streak.cur,25];
    else if(a.id==="unbreakable") prog=[S.streak.cur,50];
    else if(a.id==="immortal") prog=[S.streak.cur,100];
    else if(a.id==="quarter") prog=[S.workoutsDone,25];
    else if(a.id==="fifty") prog=[S.workoutsDone,50];
    else if(a.id==="century") prog=[S.workoutsDone,100];
    else if(a.id==="warrior") prog=[S.cycles,10];
    else if(a.id==="pr-10") prog=[S.prLog.length,10];
    else if(a.id==="pr-machine") prog=[S.prLog.length,25];
    else if(a.id==="pr-50") prog=[S.prLog.length,50];
    if(prog && prog[0]>0) out.push({...a,ratio:prog[0]/prog[1],progress:prog[0]+" / "+prog[1]});
  }
  return out.sort((a,b)=>b.ratio-a.ratio).slice(0,n);
}
function consistency90(){
  if(!S.sessions.length) return 0;
  const now=Date.now();
  const first=new Date(S.sessions[0].dateISO+"T12:00").getTime();
  const span=Math.min(90,Math.max(1,Math.round((now-first)/86400000)+1));
  // expected sessions: one per window (windowHours), capped at 1/day
  const cut=now-90*86400000;
  const activeDays=new Set([
    ...S.sessions.filter(s=>new Date(s.dateISO+"T12:00").getTime()>cut).map(s=>s.dateISO),
    ...S.recovery.filter(r=>new Date(r.date+"T12:00").getTime()>cut).map(r=>r.date),
  ]).size;
  return Math.min(100,Math.round(activeDays/span*100));
}
function heatmapHTML(days){
  const today=new Date(); today.setHours(12,0,0,0);
  const volByDay={};
  for(const s of S.sessions) volByDay[s.dateISO]=(volByDay[s.dateISO]||0)+s.volume;
  const missed=new Set();
  for(const h of S.streak.history) if(h.ended) missed.add(h.ended);
  const recDays=new Set(S.recovery.map(r=>r.date));
  const vols=Object.values(volByDay).sort((a,b)=>a-b);
  const q=p=>vols.length?vols[Math.min(vols.length-1,Math.floor(vols.length*p))]:0;
  const q1=q(.25),q2=q(.5),q3=q(.75);
  // align to weeks ending today
  const start=new Date(today.getTime()-(days-1)*86400000);
  const startDow=(start.getDay()+6)%7; // Mon=0
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<span></span>`;
  for(let i=0;i<days;i++){
    const d=new Date(start.getTime()+i*86400000);
    const iso=dayISO(d.getTime());
    const v=volByDay[iso];
    let cls="hm-cell";
    if(v){ cls+= v>=q3?" l4": v>=q2?" l3": v>=q1?" l2":" l1"; }
    else if(recDays.has(iso)) cls+=" rec";
    else if(missed.has(iso)) cls+=" miss";
    if(iso===dayISO(Date.now())) cls+=" today";
    cells+=`<span class="${cls}" title="${iso}"></span>`;
  }
  return `<div class="heatmap">${cells}</div>
  <div style="display:flex;gap:14px;margin-top:10px;font-size:10px;color:var(--dim);align-items:center">
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell l3" style="width:9px;height:9px;display:inline-block"></span> trained</span>
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell rec" style="width:9px;height:9px;display:inline-block"></span> active rest</span>
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell" style="width:9px;height:9px;display:inline-block"></span> rest</span>
    <span style="display:flex;gap:4px;align-items:center"><span class="hm-cell miss" style="width:9px;height:9px;display:inline-block"></span> streak broken</span>
  </div>`;
}

function lineChart(pts,{w=340,h=160,unit="",accent="var(--accent)",fill=true}={}){
  if(pts.length===0) return `<div style="padding:30px 10px;text-align:center;color:var(--dim);font-size:13px">No data yet — log workouts to see progression.</div>`;
  const pad={l:34,r:10,t:14,b:22};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  if(y0===y1){ y0-=1; y1+=1; }
  const yr=y1-y0; y0-=yr*.12; y1+=yr*.12;
  const X=v=>x1===x0?pad.l+(w-pad.l-pad.r)/2:pad.l+(v-x0)/(x1-x0)*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-(v-y0)/(y1-y0)*(h-pad.t-pad.b);
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(x1).toFixed(1)} ${h-pad.b} L${X(x0).toFixed(1)} ${h-pad.b} Z`;
  const gid="g"+Math.random().toString(36).slice(2,8);
  let grid="";
  for(let i=0;i<=3;i++){
    const gy=pad.t+(h-pad.t-pad.b)*i/3;
    const gv=y1-(y1-y0)*i/3;
    grid+=`<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="rgba(255,255,255,.06)"/>
    <text x="${pad.l-6}" y="${gy+3}" text-anchor="end" class="axis-lbl">${Math.round(gv)}</text>`;
  }
  const xl=pts.length>1?`<text x="${pad.l}" y="${h-6}" class="axis-lbl">${fmtDateShort(dayISO(x0))}</text>
  <text x="${w-pad.r}" y="${h-6}" text-anchor="end" class="axis-lbl">${fmtDateShort(dayISO(x1))}</text>`:"";
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(230,255,92,.22)"/><stop offset="1" stop-color="rgba(230,255,92,0)"/></linearGradient>
      <linearGradient id="${gid}s" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FF4D8D"/><stop offset=".45" stop-color="#FF9F43"/><stop offset=".75" stop-color="#E6FF5C"/><stop offset="1" stop-color="#35E0A1"/></linearGradient>
    </defs>
    ${grid}
    ${fill?`<path d="${area}" fill="url(#${gid})"/>`:""}
    <path d="${path}" fill="none" stroke="url(#${gid}s)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.length<=40?pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="var(--bg)" stroke="#fff" stroke-width="1.6"/>`).join(""):""}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5" fill="#35E0A1" stroke="#fff" stroke-width="2"/>
    ${xl}
  </svg>`;
}

/* ---------------- training (work carried out) ---------------- */
function barChart(items,{w=340,h=150,fmt=v=>fmtKg(v)}={}){
  if(!items.length||items.every(i=>!i.value)) return `<div style="padding:30px 10px;text-align:center;color:var(--dim);font-size:13px">No training logged yet.</div>`;
  const pad={l:8,r:8,t:24,b:20};
  const max=Math.max(...items.map(i=>i.value))||1;
  const bw=(w-pad.l-pad.r)/items.length;
  let bars="";
  items.forEach((it,i)=>{
    const bh=Math.max(2,(h-pad.t-pad.b)*it.value/max);
    const x=pad.l+i*bw+bw*.18, y=h-pad.b-bh;
    const isLast=i===items.length-1;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="3"
      fill="${isLast?"var(--brand)":it.value===max?"rgba(230,255,92,.7)":"rgba(230,255,92,.32)"}"/>`;
    if(isLast||it.value===max) bars+=`<text x="${(x+bw*.32).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" class="axis-lbl" style="fill:${isLast?"var(--accent)":"var(--muted)"};font-weight:700">${fmt(it.value)}</text>`;
    if(it.label&&(items.length<=6||i%2===(items.length-1)%2)) bars+=`<text x="${(x+bw*.32).toFixed(1)}" y="${h-6}" text-anchor="middle" class="axis-lbl">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" stroke="rgba(255,255,255,.08)"/>${bars}</svg>`;
}
function weekKey(ts){ // Monday of that week
  const d=new Date(ts); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return dayISO(d.getTime());
}
function trainingViewHTML(){
  const now=Date.now();
  // last 12 weeks buckets
  const weeks=[];
  for(let i=11;i>=0;i--){
    const wkStart=weekKey(now-i*7*86400000);
    weeks.push({key:wkStart,label:fmtDateShort(wkStart).split(" ").slice(0,2).join(" "),vol:0,sets:0,ses:0});
  }
  const byKey=Object.fromEntries(weeks.map(w=>[w.key,w]));
  for(const s of S.sessions){
    const k=weekKey(new Date(s.dateISO+"T12:00").getTime());
    if(byKey[k]){ byKey[k].vol+=s.volume; byKey[k].sets+=s.sets.length; byKey[k].ses++; }
  }
  const thisW=weeks[11], lastW=weeks[10];
  const dVol=lastW.vol>0?Math.round((thisW.vol-lastW.vol)/lastW.vol*100):null;
  // per-workout split (all time)
  const split=CYCLE.map(w=>({label:w,value:sum(S.sessions.filter(s=>s.workout===w).map(s=>s.volume))}));
  const totVol=sum(S.sessions.map(s=>s.volume));
  const totSets=sum(S.sessions.map(s=>s.sets.length));
  const totReps=sum(S.sessions.map(s=>sum(s.sets.map(x=>x.reps))));
  return `
    <div class="statgrid" style="margin-bottom:14px">
      <div class="stat"><div class="l">This week</div><div class="v mono" style="font-size:20px">${fmtKg(thisW.vol)}kg</div>
        ${dVol!==null?`<div style="font-size:12px;font-weight:700;color:${dVol>=0?"var(--success)":"var(--danger)"}">${dVol>=0?"+":""}${dVol}% vs last week</div>`:""}</div>
      <div class="stat"><div class="l">Sets this week</div><div class="v mono">${thisW.sets}</div>
        <div style="font-size:12px;color:var(--muted)">${thisW.ses} session${thisW.ses===1?"":"s"}</div></div>
    </div>
    <div class="chart-box"><div class="spread" style="padding:0 6px 8px"><span class="eyebrow">Weekly volume — 12 weeks</span></div>
      ${barChart(weeks.map(w=>({label:w.label,value:w.vol})))}</div>
    <div class="chart-box"><div class="spread" style="padding:0 6px 8px"><span class="eyebrow">Working sets per week</span></div>
      ${barChart(weeks.map(w=>({label:w.label,value:w.sets})),{fmt:v=>Math.round(v)})}</div>
    <div class="chart-box"><div class="spread" style="padding:0 6px 8px"><span class="eyebrow">Volume by workout — all time</span></div>
      ${barChart(split,{h:130})}</div>
    <div class="statgrid">
      <div class="stat"><div class="l">Lifetime volume</div><div class="v mono" style="font-size:19px">${fmtKg(totVol)}kg</div></div>
      <div class="stat"><div class="l">Lifetime sets</div><div class="v mono">${totSets.toLocaleString("en-GB")}</div></div>
      <div class="stat"><div class="l">Lifetime reps</div><div class="v mono">${totReps.toLocaleString("en-GB")}</div></div>
      <div class="stat"><div class="l">Sessions</div><div class="v mono">${S.sessions.length}</div></div>
    </div>`;
}

function savePhoto(){
  const f=el("ph-file").files[0];
  if(!f){ toast("Choose a photo first"); return; }
  const img=new Image();
  img.onload=()=>{
    const maxW=520, sc=Math.min(1,maxW/img.width);
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL("image/jpeg",0.72);
    try{
      S.photos.push({id:Date.now(),date:el("ph-date").value||dayISO(Date.now()),type:el("ph-type").value,dataUrl});
      save(); closeSheet(); renderProgress(); toast("Photo saved",true);
    }catch(e){ toast("Storage full — delete old photos"); }
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
}

function groupIntensity(){
  // sets per muscle group in last 30 days -> intensity class
  const cut=Date.now()-30*86400000;
  const counts={};
  for(const s of S.sessions){
    if(new Date(s.dateISO+"T12:00").getTime()<cut) continue;
    for(const set of s.sets){
      for(const g of EXERCISES[set.ex].groups) counts[g]=(counts[g]||0)+1;
    }
  }
  const out={};
  for(const g in GROUPS){
    const c=counts[g]||0;
    out[g]= c===0?0 : c<8?1 : c<20?2 : 3;
  }
  return out;
}

/* ---------------- reports ---------------- */
function periodStats(fromTs,toTs){
  const ses=S.sessions.filter(s=>{const t=new Date(s.dateISO+"T12:00").getTime();return t>=fromTs&&t<toTs;});
  const sets=sum(ses.map(s=>s.sets.length));
  const prs=sum(ses.map(s=>s.prs.length));
  const xp=sum(ses.map(s=>s.xp));
  const vol=sum(ses.map(s=>s.volume));
  return {ses,n:ses.length,sets,prs,xp,vol};
}
function bestImprovement(fromTs){
  let best=null;
  for(const ex of Object.keys(EXERCISES)){
    const exp=exposuresOf(ex);
    const inP=exp.filter(e=>new Date(e.date+"T12:00").getTime()>=fromTs);
    const before=exp.filter(e=>new Date(e.date+"T12:00").getTime()<fromTs);
    if(!inP.length||!before.length) continue;
    const a=before[before.length-1], b=inP[inP.length-1];
    if(a.bestE1<=0) continue;
    const pc=(b.bestE1-a.bestE1)/a.bestE1*100;
    if(!best||pc>best.pc) best={ex,pc,from:`${fmtKg(a.topW)}kg best set`,to:`${fmtKg(b.topW)}kg`,a,b};
  }
  return best;
}
function recommendation(){
  // stalled = no e1RM or volume gain across last 3 exposures
  for(const ex of Object.keys(EXERCISES)){
    const exp=exposuresOf(ex);
    if(exp.length<4) continue;
    const last4=exp.slice(-4);
    let stalled=true;
    for(let i=1;i<last4.length;i++){
      if(last4[i].bestE1>last4[0].bestE1+0.01||last4[i].volume>last4[0].volume) {stalled=false;break;}
    }
    if(stalled) return `Your ${EXERCISES[ex].short.toLowerCase()} has stalled across three sessions. Consider reducing the load slightly and rebuilding.`;
  }
  if(S.sessions.length>=3) return "You're progressing across almost every lift. Keep loads unchanged and continue.";
  return "Log a few more sessions and your first recommendation will appear here.";
}

function exportData(){

function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.sessions||!d.streak) throw 0;
      S=d; save(); location.reload();
    }catch(e){ toast("Invalid backup file"); } };
  r.readAsText(f);
}

function bumpW(d){ const i=el("in-w"); i.value=Math.max(0,Math.round((parseFloat(i.value||0)+d)*10)/10); }
function bumpR(d){ const i=el("in-r"); i.value=Math.max(0,parseInt(i.value||0)+d); }

function completeSet(){
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  const ex=wk.ex[A.exIndex], def=EXERCISES[ex], pr=presc(ex,A.workout);
  const w=parseFloat(el("in-w").value)||0;
  const reps=parseInt(el("in-r").value)||0;
  if(reps<=0){ toast("Enter your reps first"); return; }
  A.weights[ex]=w; A.lastReps[ex]=reps;
  A.sets.push({ex,w,reps});
  A.xp+=XP.SET;
  const prs=checkSetPRs(ex,w,reps,dayISO(Date.now()));
  for(const p of prs){
    A.prs.push(p); A.xp+=XP.PR;
    S.prLog.push({date:dayISO(Date.now()),ex,type:p.type,label:p.label});
    toast(`🏆 NEW PR — ${p.label} <b style="color:var(--gold)">${p.delta}</b>`);
    sndPR(); haptic([30,60,30,60,80]);
  }
  if(!prs.length){ sndSet(); haptic(15); }
  const doneSets=A.sets.filter(s=>s.ex===ex);
  const exDone=doneSets.length>=pr.sets;
  if(exDone && !A.finished?.includes(ex)){ A.finished=A.finished||[]; A.finished.push(ex); scoreExercise(ex,doneSets); }
  save();

  const partner=ssPartner(A.workout,ex);
  if(partner){
    const pIdx=wk.ex.indexOf(partner), pPr=presc(partner,A.workout);
    const pDone=A.sets.filter(s=>s.ex===partner).length>=pPr.sets;
    const isFirst=wk.superset[0]===ex;
    if(isFirst && !pDone){ A.exIndex=pIdx; save(); renderWorkout(); return; }          // straight into partner, no rest
    if(!isFirst && !exDone){ /* second partner has sets left; go back to first if it has sets left, else stay */ }
    if(!exDone || !pDone){
      // pick whichever still has sets, prefer first partner
      const firstEx=wk.superset[0], firstIdx=wk.ex.indexOf(firstEx);
      const firstDone=A.sets.filter(s=>s.ex===firstEx).length>=presc(firstEx,A.workout).sets;
      A.exIndex = !firstDone?firstIdx:pIdx; save();
      startRest(false, pr.rest); return;
    }
    // both partners complete
    advanceAfter(Math.max(A.exIndex,pIdx)); return;
  }
  if(exDone) advanceAfter(A.exIndex); else startRest(false, pr.rest);
}
function scoreExercise(ex,sets){
  const A=S.activeSession, def=EXERCISES[ex], pr=presc(ex,A.workout);
  A.xp+=XP.EXERCISE;
  const sesPRs=checkSessionPRs(ex,sets,dayISO(Date.now()));
  for(const p of sesPRs){
    A.prs.push(p); A.xp+=XP.PR;
    S.prLog.push({date:dayISO(Date.now()),ex,type:p.type,label:p.label});
    toast(`🏆 ${p.label} <b style="color:var(--gold)">${p.delta}</b>`);
    sndPR();
  }
  const topW=Math.max(...sets.map(s=>s.w));
  const mastered=sets.length>=pr.sets && sets.every(s=>s.reps>=pr.repHi);
  const key=A.workout+":"+topW;
  if(mastered && !S.exState[ex].mastered.includes(key)){
    S.exState[ex].mastered.push(key);
    A.xp+=XP.MASTER;
    toast(`🏋️ WEIGHT MASTERED — ${fmtKg(topW)}${def.unit} complete. Next: ${fmtKg(topW+def.inc)}${def.unit}`,true);
    sndPR(); haptic([40,80,40,80,120]);
  }
}
function advanceAfter(idx){
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  if(idx < wk.ex.length-1){
    A.exIndex=idx+1; save();
    startRest(true, presc(wk.ex[idx],A.workout).rest);
  } else finishWorkout();
}

/* ---------------- rest timer ---------------- */
let restT=null, restLeft=0, restTotal=0, restNext=null;
function startRest(betweenEx,secs){
  restTotal=(S.settings.restSec>0?S.settings.restSec:null)||secs||120; restLeft=restTotal;
  restNext=betweenEx||false;
  drawRest();
  el("rest-overlay").classList.add("open");
  clearInterval(restT);
  restT=setInterval(()=>{
    restLeft--;
    if(restLeft<=0){ endRest(true); return; }
    drawRest();
  },1000);
}
function drawRest(){
  const R=104, C=2*Math.PI*R;
  const p=restLeft/restTotal;
  const A=S.activeSession, wk=WORKOUTS[A.workout];
  const nextEx=EXERCISES[wk.ex[A.exIndex]];
  el("rest-overlay").innerHTML=`
    <div class="eyebrow" style="letter-spacing:.2em">${restNext?"NEXT EXERCISE":"NEXT SET IN"}</div>
    <div class="ring-wrap">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--card3)" stroke-width="12"/>
        <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset 1s linear"/>
      </svg>
      <div class="t">
        <div class="big-num mono" style="font-size:56px">${fmtDur(restLeft)}</div>
        <div style="color:var(--muted);font-weight:700;font-size:14px">${restNext?"Up next: ":""}${nextEx.short}</div>
      </div>
    </div>
    <div class="row" style="width:260px">
      <button class="btn ghost" onclick="restLeft+=30;restTotal=Math.max(restTotal,restLeft);drawRest()">+30 sec</button>
      <button class="btn primary" onclick="endRest(false)">Skip rest</button>
    </div>`;
}
function endRest(natural){
  clearInterval(restT);
  el("rest-overlay").classList.remove("open");
  if(natural){ sndTimer(); haptic([60,80,60,80,60]); }
  renderWorkout();
}

/* ---------------- finish workout ---------------- */
function finishWorkout(){
  const A=S.activeSession;
  const now=Date.now();
  A.xp+=XP.WORKOUT;
  const volume=sum(A.sets.map(s=>s.w*s.reps));
  // cycle bonus
  let cycleDone=false;
  if(A.workout===CYCLE[CYCLE.length-1]){ S.cycles++; A.xp+=XP.CYCLE; cycleDone=true; }
  // streak bonuses
  const scoreBefore=computeScore().overall;
  bumpStreakOnComplete(now);
  const stCur=S.streak.cur;
  let streakBonus=0;
  if(stCur===10)streakBonus=100; else if(stCur===25)streakBonus=300; else if(stCur===50)streakBonus=750; else if(stCur===100)streakBonus=2000;
  A.xp+=streakBonus;
  // per-exercise XP
  for(const ex of WORKOUTS[A.workout].ex){
    const exSets=A.sets.filter(s=>s.ex===ex);
    const exPRs=A.prs.filter(p=>p.ex===ex).length;
    S.exState[ex].xp += exSets.length*XP.SET + XP.EXERCISE + exPRs*XP.PR;
    if(exSets.length) S.exState[ex].weight=Math.max(...exSets.map(s=>s.w));
  }
  const session={
    id:now, workout:A.workout, dateISO:dayISO(now), start:A.start, end:now,
    dur:Math.round((now-A.start)/1000), sets:A.sets, volume, xp:A.xp, prs:A.prs,
  };
  S.sessions.push(session);
  S.workoutsDone++;
  addXP(A.xp,"Workout "+A.workout,true);
  S.nextWorkout=CYCLE[(CYCLE.indexOf(A.workout)+1)%CYCLE.length];
  const scoreAfter=computeScore().overall;
  S.scoreHistory.push({date:dayISO(now),score:scoreAfter});
  const newAch=evalAchievements();
  S.activeSession=null;
  save();
  sndDone(); haptic([50,100,50,100,50,100,150]);
  el("workout-overlay").classList.remove("open");
  renderPost(session,{scoreBefore,scoreAfter,streakBonus,cycleDone,newAch});
}

/* volt spark burst on workout completion */
function celebrate(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const host=el("post-overlay");
  const c=document.createElement("canvas");
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:130";
  c.width=host.clientWidth*devicePixelRatio; c.height=host.clientHeight*devicePixelRatio;
  host.appendChild(c);
  const x=c.getContext("2d"); x.scale(devicePixelRatio,devicePixelRatio);
  const W=host.clientWidth, H=host.clientHeight;
  const P=[]; const COLS=["#E6FF5C","#FF4D8D","#FFD54A","#35E0A1"];
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, v=3+Math.random()*7;
    P.push({x:W/2,y:H*0.22,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,
      s:1.5+Math.random()*2.5,c:COLS[i%3],life:1,decay:.012+Math.random()*.014,r:Math.random()*Math.PI});
  }
  let frames=0;
  (function tick(){
    x.clearRect(0,0,W,H);
    let alive=false;
    for(const p of P){
      if(p.life<=0) continue;
      alive=true;
      p.x+=p.vx; p.y+=p.vy; p.vy+=.16; p.vx*=.985; p.life-=p.decay; p.r+=.1;
      x.save(); x.globalAlpha=Math.max(0,p.life); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=p.c; x.fillRect(-p.s,-p.s/2.5,p.s*2,p.s/1.2); x.restore();
    }
    frames++;
    if(alive&&frames<220) requestAnimationFrame(tick); else c.remove();
  })();
}

function showStreakLost(lost){
  const avgImp=(()=>{
    let pcs=[];
    for(const ex of Object.keys(EXERCISES)){
      const exp=exposuresOf(ex).filter(e=>lost.started&&e.date>=lost.started);
      if(exp.length>=2&&exp[0].bestE1>0) pcs.push((exp[exp.length-1].bestE1-exp[0].bestE1)/exp[0].bestE1*100);
    }
    return pcs.length?Math.round(sum(pcs)/pcs.length*10)/10:null;
  })();
  openSheet(`
    <div style="text-align:center;padding:10px 0">
      <div class="eyebrow" style="color:var(--danger);letter-spacing:.22em">Momentum lost</div>
      <div class="big-num" style="margin:14px 0 4px;color:var(--danger)">${lost.len}</div>
      <div style="color:var(--muted);font-weight:600">workout streak ended</div>
      <div class="statgrid" style="margin:20px 0;text-align:left">
        <div class="stat"><div class="l">Consecutive sessions</div><div class="v mono">${lost.len}</div></div>
        <div class="stat"><div class="l">Days of momentum</div><div class="v mono">${lost.days}</div></div>
        <div class="stat"><div class="l">PRs in that run</div><div class="v mono">${lost.prs}</div></div>
        <div class="stat"><div class="l">Avg strength gain</div><div class="v mono">${avgImp!==null?(avgImp>=0?"+":"")+avgImp+"%":"—"}</div></div>
      </div>
      <p style="color:var(--muted);font-size:15px;font-weight:600">That run is over.<br>Start the next one.</p>
      <button class="btn primary" style="margin-top:16px" onclick="closeSheet();startOrResumeWorkout()">REBUILD — START WORKOUT ${S.nextWorkout}</button>
    </div>`);
}

/* ---------------- in-app reminders ---------------- */
let notified={};
setInterval(()=>{
  if(!S.settings.notify||!("Notification" in window)||Notification.permission!=="granted") return;
  const ss=streakState();
  if(ss.status!=="live") return;
  const h=ss.left/3600000;
  const fire=(key,body)=>{
    const day=dayISO(Date.now());
    if(notified[key]===day) return;
    notified[key]=day;
    try{ new Notification("FORGE",{body}); }catch(e){}
  };
  if(h<=1) fire("h1",`${S.streak.cur} workouts. Don't throw it away now.`);
  else if(h<=6) fire("h6",`6 hours. Don't break ${S.streak.cur}.`);
  else if(ss.sinceAct>=40) fire("inact2",`🚨 Second day with no activity. ${S.streak.cur}-workout streak at risk.`);
  else if(h<=18) fire("h18",`${Math.ceil(h)} hours left to protect your ${S.streak.cur}-workout streak.`);
  else if(ss.sinceAct>=26) fire("inact1",`No activity yesterday. Train or log active recovery.`);
},60000);

/* ---------------- workout clock tick ---------------- */
setInterval(()=>{
  const c=el("wk-clock");
  if(c&&S.activeSession) c.textContent=fmtDur((Date.now()-S.activeSession.start)/1000);
},1000);

/* ---------------- demo seed (optional preview) ---------------- */
function seedDemo(){
  if(!confirm("Load 8 weeks of sample training data so you can preview every screen? You can reset it any time.")) return;
  S=freshState();
  const start=Date.now()-56*86400000;
  let t=start, wi=0;
  const w0={"incline-bench":70,"barbell-row":70,"lateral-raise":10,"curl":14,"front-squat":80,"rdl":90,"calf-raise":60,"cable-crunch":35,"lat-pulldown":60,"ohp":45,"bss":16};
  const prog={};
  while(t<Date.now()-36e5){
    if(Math.random()<0.06 && S.streak.cur>3){ t+=60*3600000; S.streak.cur=0; S.streak.windowEnds=null; S.streak.history.push({len:5,days:9,prs:2,ended:dayISO(t),started:dayISO(t-9*86400000)}); }
    const wk=CYCLE[wi%CYCLE.length];
    const A={workout:wk,start:t,exIndex:0,setIndex:0,sets:[],prs:[],xp:0,weights:{},lastReps:{}};
    for(const ex of WORKOUTS[wk].ex){
      const def=Object.assign({},EXERCISES[ex],presc(ex,wk));
      prog[ex]=prog[ex]||{w:w0[ex],reps:def.repLo+1};
      const p=prog[ex];
      for(let i=0;i<def.sets;i++){
        const reps=Math.max(def.repLo-1,Math.min(def.repHi,p.reps-Math.floor(i/2)+(Math.random()<.3?1:0)));
        A.sets.push({ex,w:p.w,reps});
        A.xp+=XP.SET;
        const prs=checkSetPRs(ex,p.w,reps,dayISO(t));
        for(const pr of prs){A.prs.push(pr);A.xp+=XP.PR;S.prLog.push({date:dayISO(t),ex,type:pr.type,label:pr.label});}
      }
      const sesPRs=checkSessionPRs(ex,A.sets.filter(s=>s.ex===ex),dayISO(t));
      for(const pr of sesPRs){A.prs.push(pr);A.xp+=XP.PR;S.prLog.push({date:dayISO(t),ex,type:pr.type,label:pr.label});}
      A.xp+=XP.EXERCISE;
      S.exState[ex].xp+=def.sets*XP.SET+XP.EXERCISE+A.prs.filter(x=>x.ex===ex).length*XP.PR;
      S.exState[ex].weight=p.w;
      if(Math.random()<.45){ p.reps++; if(p.reps>def.repHi){ p.reps=def.repLo+1; p.w+=def.inc; } }
    }
    A.xp+=XP.WORKOUT;
    if(wk===CYCLE[CYCLE.length-1]){S.cycles++;A.xp+=XP.CYCLE;}
    bumpStreakOnComplete(t);
    const vol=sum(A.sets.map(s=>s.w*s.reps));
    S.sessions.push({id:t,workout:wk,dateISO:dayISO(t),start:t-2100000,end:t,dur:1980+Math.floor(Math.random()*600),sets:A.sets,volume:vol,xp:A.xp,prs:A.prs});
    S.workoutsDone++; S.xp+=A.xp;
    S.scoreHistory.push({date:dayISO(t),score:computeScore().overall});
    wi++;
    t+=(40+Math.random()*14)*3600000;
  }
  S.nextWorkout=CYCLE[wi%CYCLE.length];
  S.streak.windowEnds=Date.now()+windowMs()*0.7;
  // bodyweight drift 95 -> up
  for(let d=0;d<=56;d+=4){
    S.bodyLogs.push({date:dayISO(start+d*86400000),weight:Math.round((95+d*0.035+Math.random()*.4-.2)*10)/10,
      waist:Math.round((86+d*0.005)*10)/10,chest:Math.round((109+d*0.03)*10)/10,arms:Math.round((39+d*0.015)*10)/10,thighs:Math.round((63+d*0.02)*10)/10});
  }
  evalAchievements();
  save(); location.reload();
}

/* ---------------- init ---------------- */
load();
handleExpiry();
renderToday();
if(S.activeSession){
  // resume in-progress workout after refresh
  renderWorkout(); el("workout-overlay").classList.add("open");
}

/* ---------------- PWA + update banner ---------------- */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // check for a new version every time the app is opened / foregrounded
      reg.update();
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update(); });
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller) showUpdateBanner();
        });
      });
    }).catch(()=>{});
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!refreshing){ refreshing=true; location.reload(); } });
  });
}
function showUpdateBanner(){
  if(el("upd-banner")) return;
  const b=document.createElement("div");
  b.id="upd-banner";
  b.style.cssText="position:fixed;left:14px;right:14px;top:calc(10px + var(--sat));z-index:500;max-width:492px;margin:0 auto;background:var(--brand);color:var(--accent-ink);border-radius:99px;padding:12px 18px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 40px rgba(230,255,92,.3);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both;cursor:pointer";
  b.innerHTML='<span>✨ New FORGE version ready</span><span style="background:rgba(0,0,0,.2);border-radius:99px;padding:6px 12px">Update</span>';
  b.onclick=()=>{ navigator.serviceWorker.getRegistration().then(r=>{ if(r&&r.waiting) r.waiting.postMessage("SKIP_WAITING"); else location.reload(); }); };
  document.body.appendChild(b);
}
